  --magenta:#ff3a22;
  --cyan:#628078;
  --lime:#a4893d;
  --gold:#c7af6b;
  --danger:#cc2a16;
  --grad:linear-gradient(135deg,#ff3a22 0%,#ff6a55 100%);
  --grad-cyan:linear-gradient(135deg,#628078 0%,#4d6b61 100%);
  --font-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  --shadow:0 10px 28px rgba(60,40,10,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
img{max-width:100%}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--fg)}
input::placeholder,textarea::placeholder{color:var(--faint)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:9px}
.tnum{font-variant-numeric:tabular-nums}
.range-row{display:flex;gap:6px;margin:10px 0 2px}
.range-pill{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 4px;font-weight:800;font-size:12px;color:var(--muted)}
.range-pill.active{background:var(--primary);border-color:var(--primary);color:#fff}
.range-pill:active{transform:scale(.97)}
.range-tag{font-family:var(--font-ui);font-size:10.5px;font-weight:700;color:var(--faint);text-transform:none;letter-spacing:0;margin-left:6px}
.goal-row input[type=date]{color-scheme:light}
[class*="-ring"] *,.ring span,.cal-left,.fast-time,.stat .v,.snap .v,.v.tnum{font-variant-numeric:tabular-nums;letter-spacing:-.3px}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;position:relative}
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 18px 12px;
  background:linear-gradient(180deg,rgba(243,239,230,.96),rgba(243,239,230,.72));backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(255,58,34,.4)}
.logo svg{width:20px;height:20px;display:block}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.5px;margin:0;line-height:1}
.brand .sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin-top:1px}
.streak-chip{display:flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);
  padding:6px 11px;border-radius:999px;font-weight:800;font-size:14px}
.streak-chip .flame{font-size:15px;filter:saturate(1.3)}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:17px}
.icon-btn:active{transform:scale(.94)}

main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.tab-panel{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- bottom nav ---------- */
#nav{flex:0 0 auto;position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg,var(--bg) 60%,rgba(243,239,230,0));z-index:20}
.nav-inner{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:6px;box-shadow:var(--shadow);width:100%;max-width:420px}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:7px 4px;min-height:58px;border:0;
  background:transparent;border-radius:16px;color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.4px;
  text-transform:uppercase;transition:color .18s,background .18s}
.nav-btn svg{width:22px;height:22px}
.nav-btn.active{color:var(--fg);background:var(--surface-2)}
.nav-btn.center .fab{width:38px;height:38px;border-radius:50%;background:var(--grad);display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(255,58,34,.45)}
.nav-btn.center .fab svg{width:22px;height:22px;color:#fff}
.nav-btn.center.active{background:transparent;color:var(--primary)}
.nav-btn.center.active .fab{box-shadow:0 6px 18px rgba(255,58,34,.55)}

/* ---------- generic ---------- */
.section-title{font-family:var(--font-display);font-weight:400;font-size:13px;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);margin:22px 2px 12px;display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:12px}
.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:800;font-size:15px;letter-spacing:.3px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--fg);transition:transform .12s,filter .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 18px rgba(255,58,34,.35)}
.btn-ghost{background:transparent}
.btn-block{width:100%}
.btn-cyan{background:var(--grad-cyan);border:0;color:#04121a}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.lime{color:var(--lime);border-color:rgba(164,137,61,.35);background:rgba(164,137,61,.08)}
.pill.mag{color:var(--magenta);border-color:rgba(255,58,34,.35);background:rgba(255,58,34,.08)}
.pill.cyan{color:var(--cyan);border-color:rgba(98,128,120,.35);background:rgba(98,128,120,.08)}

/* ---------- home / dashboard ---------- */
.hero{background:var(--grad);border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden;
  box-shadow:0 12px 34px rgba(255,58,34,.3)}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%)}
.hero .eyebrow{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.85);font-weight:800}
.hero .quote{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.05;color:#fff;margin:6px 0 0;
  text-wrap:balance;max-width:92%}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .k{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:14px;color:var(--muted);font-family:var(--font-ui);font-weight:700;margin-left:3px}
.stat .v .flame{font-family:var(--font-ui)}
.stat.accent .v{color:var(--primary)}
.stat.cyan .v{color:var(--cyan)}
.stat.lime .v{color:var(--lime)}
.ring-wrap{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:58px;height:58px;flex:0 0 auto;border-radius:50%;
  background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center}
.ring::before{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;font-family:var(--font-display);font-weight:800;font-size:17px;line-height:1}
.ringbox{position:relative;width:58px;height:58px;display:grid;place-items:center}

.week-dots{display:flex;justify-content:space-between;gap:6px;margin-top:4px}
.wd{flex:1;text-align:center}
.wd .dot{width:100%;aspect-ratio:1;max-width:34px;margin:0 auto 5px;border-radius:11px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--faint)}
.wd .dot.on{background:var(--grad);border:0;color:#fff;box-shadow:0 4px 12px rgba(255,58,34,.35)}
.wd .dot.today{outline:2px solid var(--cyan);outline-offset:1px}
.wd .lbl{font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);font-weight:800}
.wd .dnum{font-size:9px;font-weight:800;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wd .dnum.today{color:var(--cyan)}
.week-dots{gap:4px}

.hist-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:10px}
.hist-head{display:flex;align-items:flex-start;gap:10px}
.hist-head .date{font-family:var(--font-display);font-size:19px;line-height:1}
.hist-head .date small{display:block;font-family:var(--font-ui);font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--faint);font-weight:800;margin-top:3px}
.hist-head .meta{margin-left:auto;text-align:right}
.hist-head .meta .vol{font-family:var(--font-display);font-size:20px;color:var(--primary);line-height:1}
.hist-head .meta .volk{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:800}
.hist-ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.ex-chip{font-size:11.5px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:3px 8px;color:var(--muted)}
.ex-chip b{color:var(--fg)}
.hist-foot{display:flex;align-items:center;gap:12px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted)}
.hist-foot .gar{margin-left:auto;background:var(--surface-2);border:1px solid var(--line);color:var(--cyan);
  font-size:12px;font-weight:800;padding:5px 10px;border-radius:8px}
.hist-foot .gar:active{filter:brightness(1.25)}
.hist-foot .del{background:transparent;border:0;color:var(--faint);font-size:12px;font-weight:700;padding:5px 6px}
.hist-foot .del:active{color:var(--danger)}

.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty .big{font-family:var(--font-display);font-size:48px;line-height:1;margin-bottom:8px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.empty p{max-width:30ch;margin:6px auto 0;color:var(--faint)}

/* ---------- log ---------- */
.tpl-select{position:relative}
.tpl-select select{width:100%;appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px 44px 16px 16px;font-weight:800;font-size:16px}
.tpl-select::after{content:"▾";position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--primary);
  font-size:16px;pointer-events:none}
.sess-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:14px 0 4px;padding:12px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line)}
.start-btn{display:flex;align-items:center;gap:6px;background:var(--grad);border:0;color:#fff;border-radius:11px;
  padding:9px 15px;font-weight:800;font-size:13px;box-shadow:0 4px 12px rgba(255,58,34,.35)}
.start-btn.running{background:var(--surface-2);border:1px solid var(--line);color:var(--fg);box-shadow:none}
.start-btn:active{transform:scale(.96)}
.sess-bar .timer{font-family:var(--font-display);font-size:22px;letter-spacing:.5px}
.sess-bar .timer.run{color:var(--lime)}
.sess-bar .lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);font-weight:800}
.rest-btn{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:9px 13px;font-weight:800;font-size:13px}
.rest-btn.active{background:var(--grad-cyan);border:0;color:#04121a}
.when-row{display:flex;flex-direction:column;gap:7px;margin:14px 0 2px;padding:12px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line)}
.when-row input{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  font-weight:700;color:var(--fg);color-scheme:light;width:100%}
.when-row input:focus{outline:0;border-color:var(--primary)}
.when-row .lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);font-weight:800}
.notes-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0 2px;display:flex;flex-direction:column;gap:7px}
.notes-card .lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);font-weight:800}
.sess-notes{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;color:var(--fg);width:100%;min-height:72px;resize:vertical;font-family:inherit;line-height:1.45}
.sess-notes:focus{outline:0;border-color:var(--primary)}
.savedline{font-size:10.5px;color:var(--faint);font-weight:700;text-align:right;margin:4px 4px 0;letter-spacing:.3px}

.ex-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.ex-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ex-num{width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;
  font-family:var(--font-display);font-size:14px;color:var(--primary)}
.ex-name{flex:1;min-width:0;background:transparent;border:0;border-bottom:1.5px solid transparent;padding:4px 2px;
  font-weight:800;font-size:16px}
.ex-name:focus{outline:0;border-bottom-color:var(--primary)}
.ex-name.open{border-bottom:1.5px dashed var(--line)}
.ex-best{font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--faint);white-space:nowrap}
.ex-best b{color:var(--cyan)}
.ex-del{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);
  color:var(--faint);font-size:17px;line-height:1;font-weight:700;display:grid;place-items:center}
.ex-del:active{color:var(--danger);border-color:var(--danger)}
.sets-head,.set-row{display:grid;grid-template-columns:34px 1fr 1fr 30px;gap:8px;align-items:center}
.sets-head{margin-bottom:6px}
.sets-head span{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:800;text-align:center}
.wunit-btn{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:7px;padding:2px 7px;font:inherit;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;margin-left:4px}
.wunit-btn.lb{background:var(--primary);border-color:var(--primary);color:#fff}
.wunit-btn:active{transform:scale(.95)}
.sets-head span:first-child{text-align:left;padding-left:4px}
.set-row{margin-bottom:7px}
.set-n{font-family:var(--font-display);font-size:15px;color:var(--faint);text-align:center}
.set-row input{width:100%;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:11px 6px;font-weight:700;font-size:16px;-moz-appearance:textfield}
.set-row input::-webkit-outer-spin-button,.set-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set-row input:focus{outline:0;border-color:var(--primary);background:var(--surface-3)}
.set-row input.filled{border-color:rgba(98,128,120,.4)}
.set-row .track{font-size:10px;color:var(--cyan);text-align:center;font-weight:900}
.set-row .track.off{color:transparent}
.type-toggle{display:flex;gap:6px;margin-bottom:11px}
.type-toggle button{flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
  border-radius:10px;padding:8px;font-weight:800;font-size:12.5px}
.type-toggle button.on{background:var(--surface-3);color:var(--fg);border-color:var(--primary)}
.type-toggle button:active{transform:scale(.97)}
.cardio-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cardio-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cfield{display:flex;flex-direction:column;gap:5px;min-width:0}
.cfield span{font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfield input{width:100%;min-width:0;box-sizing:border-box;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 8px;
  font-weight:700;font-size:16px;text-align:center;-moz-appearance:textfield}
.cardio-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cardio-chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
.cardio-chip.on{background:var(--grad-cyan);border:0;color:#04121a}
.cardio-chip:active{transform:scale(.96)}
.cfield input.derived{border-color:var(--cyan);border-style:dashed;color:var(--cyan)}
.cfield input::-webkit-outer-spin-button,.cfield input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cfield input:focus{outline:0;border-color:var(--cyan)}
.pace{margin-top:9px;text-align:center;font-size:12px;font-weight:800;color:var(--cyan);min-height:14px}
.ex-block textarea.note{width:100%;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;font-size:14px;resize:vertical;min-height:0;height:38px}
.add-ex{width:100%;background:transparent;border:1.5px dashed var(--line);border-radius:14px;padding:13px;
  color:var(--muted);font-weight:800;font-size:14px;margin-bottom:12px}
.add-ex:active{border-color:var(--primary);color:var(--primary)}
.save-row{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.export-note{font-size:11.5px;color:var(--faint);text-align:center;line-height:1.5;margin-top:2px}
.export-note b{color:var(--muted)}

/* ---------- graphs ---------- */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 10px}
.chart-wrap{position:relative;height:230px;margin-top:6px}
.ex-pills{display:flex;flex-wrap:wrap;gap:7px;padding:4px 2px 10px}
.ex-pills::-webkit-scrollbar{display:none}
.ex-pill{flex:0 0 auto;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;
  font-weight:700;font-size:12.5px;color:var(--muted);white-space:nowrap}
.ex-pill.active{background:var(--grad-cyan);border:0;color:#04121a}
.prog-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.prog-item{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px}
.prog-item .nm{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-item .bw{font-family:var(--font-display);font-size:26px;line-height:1.1;margin-top:5px}
.prog-item .bw small{font-size:12px;color:var(--muted);font-family:var(--font-ui);font-weight:700}
.prog-item .chg{font-size:11px;font-weight:800;margin-top:2px}
.chg.up{color:var(--lime)}.chg.down{color:var(--danger)}.chg.flat{color:var(--faint)}

/* ---------- modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,6,10,.72);backdrop-filter:blur(3px);z-index:60;display:grid;
  place-items:end center;padding:0}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  width:100%;max-width:560px;max-height:86vh;overflow-y:auto;padding:20px 18px calc(26px + env(safe-area-inset-bottom,0px));
  animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet h2{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.5px;margin:2px 0 4px}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--surface-3);margin:0 auto 14px}
.sheet p{color:var(--muted);font-size:14px}
.sheet ol{padding-left:20px;color:var(--muted);font-size:14px;line-height:1.7}
.sheet ol b{color:var(--fg)}
.setting-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting-row:last-of-type{border-bottom:0}
.setting-row .t{font-weight:700}
.setting-row .d{font-size:12px;color:var(--faint)}
.setting-row .right{margin-left:auto}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--primary);color:#fff}
.stepper{display:flex;align-items:center;gap:0;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.stepper button{border:0;background:transparent;width:38px;height:38px;font-size:20px;font-weight:800;color:var(--fg)}
.stepper .val{min-width:34px;text-align:center;font-weight:800}
.soon{opacity:.55}
.soon .right .pill{background:var(--surface-2)}

#toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%) translateY(20px);z-index:80;
  background:var(--surface-3);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:800;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.pr{background:var(--grad);border:0;color:#fff}
#toast.undo{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast-undo{background:none;border:0;color:var(--primary);font-weight:800;font-size:14px;padding:2px 4px;cursor:pointer}

.file-in{display:none}
hr.soft{border:0;border-top:1px solid var(--line);margin:18px 0}
.foot-note{text-align:center;color:var(--faint);font-size:11px;padding:18px 10px 6px;line-height:1.6}

/* ===== combined: nutrition + body ===== */
.nav-inner.nav5 .nav-btn{font-size:9px;letter-spacing:.2px;gap:4px}
.nav-inner.nav5 .nav-btn svg{width:21px;height:21px}
.datebar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.datebar .dnav{width:40px;height:40px;flex:0 0 auto;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:22px;font-weight:800;color:var(--fg);display:grid;place-items:center}
.datebar .dnav:disabled{opacity:.3}
.datebar .dnav:active{transform:scale(.94)}
.datebar .dlabel{flex:1;text-align:center;font-family:var(--font-display);font-size:20px;letter-spacing:.5px;line-height:1}
.datebar .dlabel small{display:block;font-family:var(--font-ui);font-size:11px;color:var(--faint);font-weight:800;letter-spacing:1px;margin-top:4px}
.cal-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cal-card.compact{padding:14px;margin-bottom:16px}
.cal-top{display:flex;align-items:center;gap:16px}
.cal-ring{--p:0;position:relative;width:98px;height:98px;flex:0 0 auto;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center}
.cal-inner{width:80px;height:80px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6px;overflow:hidden}
.cal-left{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1;letter-spacing:-.5px;color:var(--primary);max-width:100%;overflow:hidden;white-space:nowrap}
.cal-inner{overflow:hidden}
.cal-left.over{color:var(--danger)}
.cal-sub{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);font-weight:800;margin-top:2px}
.cal-side{flex:1;min-width:0}
.cal-budget,.cal-eaten{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0}
.cal-side span{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:800}
.cal-side b{font-family:var(--font-display);font-size:19px}
.macros{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.mc{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px}
.mc.over{color:#fff!important;background:var(--danger)!important;font-weight:900}
.mc.c{color:#628078;background:rgba(98,128,120,.15)}
.mc.p{color:#ff3a22;background:rgba(255,58,34,.15)}
.mc.f{color:#a4893d;background:rgba(164,137,61,.18)}
.meal-minis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.meal-mini{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.meal-mini span{display:block;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);font-weight:800;margin-bottom:2px}
.meal-mini b{font-size:16px;font-family:var(--font-display)}
.snap-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.snap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.snap .k{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snap .v{font-family:var(--font-display);font-weight:800;font-size:25px;margin-top:5px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snap .v.sleepv{font-size:20px}
.snap .v small{font-size:13px;color:var(--muted);font-family:var(--font-ui);font-weight:700;margin-left:3px}
.mini-row{display:flex;align-items:center;gap:12px;padding:5px 0}
.mini-row.tappable{cursor:pointer;margin:0 -6px;padding:6px;border-radius:10px}
.mini-row.tappable:active{background:var(--surface-2)}
.mini-chev{margin-left:auto;color:var(--faint);font-size:20px;font-weight:700;flex:0 0 auto}
.sess-opt span{display:flex;flex-direction:column;gap:2px;min-width:0}
.sess-opt b{font-weight:800;font-size:14px}
.sess-opt small{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-ic{width:40px;height:40px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;background:var(--surface-2)}
.mini-ic.grad{background:var(--grad)}
.mini-main{display:flex;flex-direction:column;min-width:0}
.mini-main b{font-size:14px}
.mini-main span{font-size:12px;color:var(--muted)}
.mini-empty{color:var(--faint);font-size:13px;padding:6px 0;font-weight:600}
.mini-empty a{color:var(--primary);font-weight:800}
.streak-line{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:700}
/* reminder card */
.reminder-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.rem-h{font-weight:800;font-size:13.5px;margin-bottom:6px}
.rem-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.rem-list li{font-size:13px;color:var(--muted);padding-left:16px;position:relative}
.rem-list li:before{content:"○";position:absolute;left:0;color:var(--faint)}
.rem-list li.rem-red{color:var(--danger);font-weight:700}
.rem-list li.rem-red:before{content:"●";color:var(--danger)}
/* compact streaks row */
.streaks-row{display:flex;gap:8px;padding:12px}
.ms-tile{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.ms-ic{font-size:22px;line-height:1}
.ms-n{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1}
.ms-n small{font-size:11px;color:var(--faint);font-weight:700;margin-left:1px}
.ms-l{font-size:11px;color:var(--muted);font-weight:700}
.ms-bar{width:100%;height:5px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:3px}
.ms-fill{height:100%;background:var(--grad,var(--primary));border-radius:999px}
.ms-next{font-size:10px;color:var(--faint);font-weight:700}
/* confetti */
.confetti-wrap{position:fixed;inset:0;z-index:9999;pointer-events:auto;transition:opacity .6s;display:grid;place-items:center}
.confetti-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.confetti-msg{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);font-size:18px}
.confetti-msg b{font-family:var(--font-display);display:block;font-size:22px;color:var(--primary);margin:2px 0}
.confetti-msg small{font-size:12px;color:var(--muted)}
.meal-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.meal-head span{font-weight:800;font-size:15px}
.meal-head b{font-family:var(--font-display);font-size:18px;color:var(--primary)}
.food-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.fr-main{flex:1;min-width:0;cursor:pointer}
.fr-main b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-main span{font-size:11.5px;color:var(--faint)}
.fr-k{font-family:var(--font-display);font-size:17px}
.fr-del{background:transparent;border:0;color:var(--faint);font-size:19px;width:28px;flex:0 0 auto}
.fr-del:active{color:var(--danger)}
.add-food{width:100%;margin-top:9px;background:transparent;border:1.5px dashed var(--line);border-radius:11px;padding:10px;color:var(--muted);font-weight:800;font-size:13px}
.add-food:active{border-color:var(--primary);color:var(--primary)}
.hist-note{background:rgba(98,128,120,.08);border:1px solid rgba(98,128,120,.25);color:var(--cyan);border-radius:12px;padding:11px 13px;font-size:12.5px;font-weight:700;margin-bottom:12px;line-height:1.5}
.food-search{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;color:var(--fg)}
.food-search:focus{outline:0;border-color:var(--primary)}
.btn-scan{background:var(--surface-2);border:1px solid var(--line);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:12px;font-weight:600}
.btn-scan:active{border-color:var(--primary)}
.scan-ico{font-size:18px;color:var(--primary);line-height:1}
.scan-stage{position:relative;width:100%;aspect-ratio:4/3;max-height:46vh;background:#000;border-radius:14px;overflow:hidden;margin-top:4px}
.scan-stage video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:16% 12%;border:2px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.28)}
.scan-status{margin-top:12px;font-size:14px;color:var(--muted);text-align:center;min-height:20px}
.scan-sheet #scanManual{flex:1}
/* ---- add-food actions (scan / photo / copy) ---- */
.add-actions{display:flex;gap:8px;margin-bottom:10px}
.add-actions .btn{flex:1;margin:0}
.btn-copy{background:var(--surface-2);border:1px solid var(--line);color:var(--fg);font-weight:600;font-size:13.5px}
.btn-copy:active{border-color:var(--primary)}
/* ---- food row move ---- */
.fr-move{background:none;border:0;color:var(--faint);font-size:20px;line-height:1;padding:0 6px;cursor:pointer}
.fr-move:active{color:var(--primary)}
.day-list,.meal-move{display:flex;flex-direction:column;gap:6px}
.meal-move{flex-direction:row;flex-wrap:wrap}
.day-opt{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--fg);text-align:left}
.day-opt small{color:var(--faint)}
.mm-opt{flex:1 1 42%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 10px;color:var(--fg);font-weight:600;font-size:13.5px}
.mm-opt.copy{border-style:dashed}
.mm-opt:active{border-color:var(--primary)}
/* ---- portion unit select ---- */
.unit-sel{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;color:var(--fg);min-width:150px}
/* ---- water card ---- */
.wtr-goal{font-size:12px;font-weight:600;color:var(--cyan);cursor:pointer}
.water-card{padding:14px 16px}
.wtr-top{display:flex;gap:14px;align-items:center}
.wtr-ring{--p:0;position:relative;width:88px;height:88px;flex:0 0 auto;border-radius:50%;background:conic-gradient(#3b9ec4 calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center}
.wtr-inner{width:70px;height:70px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.wtr-inner b{font-family:var(--font-display);font-weight:800;font-size:19px;color:#3b9ec4;line-height:1}
.wtr-inner small{font-size:10px;color:var(--faint)}
.wtr-side{flex:1;min-width:0}
.wtr-sub{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.wtr-btns{display:flex;flex-wrap:wrap;gap:6px}
.wtr-b{flex:1 1 44%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;color:var(--fg);font-weight:700;font-size:12.5px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.wtr-b small{font-weight:500;color:var(--faint);font-size:10px}
.wtr-b:active{border-color:#3b9ec4}
.wtr-btns2{display:flex;gap:6px;margin-top:6px}
.wtr-x{flex:1;background:none;border:0;color:var(--faint);font-size:12.5px;font-weight:600;padding:4px}
.unit-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.unit-chips button{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--fg);font-size:13px;font-weight:600}
.unit-chips button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
/* ---- training source tags ---- */
.src-tag{font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--cyan);background:var(--surface-2);border-radius:6px;padding:1px 5px;vertical-align:middle}
.src-tag.g{color:#3b9ec4}
/* ---- macro mode + presets ---- */
.seg.macro-mode{width:100%;display:flex;margin:4px 0 10px}
.seg.macro-mode button{flex:1}
.preset-list{display:flex;flex-direction:column;gap:5px;max-height:34vh;overflow-y:auto}
.preset-opt{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);text-align:left}
.preset-opt.on{border-color:var(--primary);background:var(--surface)}
.po-name{font-weight:600;font-size:14px}
.po-ratio{font-family:var(--font-display);font-size:13px;color:var(--faint)}
.po-ratio b{font-weight:800}.po-ratio b.c{color:var(--cyan)}.po-ratio b.p{color:#9b7bd6}.po-ratio b.f{color:var(--gold)}
.sheet.tall{max-height:88vh;overflow-y:auto}
/* ---- goal card ---- */
.goal-card{padding:14px 16px;cursor:pointer}
.gc-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.gc-k{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);font-weight:800}
.gc-main{font-size:17px;margin-top:2px}.gc-main b{font-family:var(--font-display);font-weight:800}
.gc-pct{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--primary)}
.gc-bar{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.gc-fill{height:100%;background:var(--grad,var(--primary));border-radius:999px}
.gc-sub{font-size:12px;color:var(--muted);margin-top:7px}
/* ---- fast completed ring ---- */
.fast-ring.done{background:conic-gradient(#46a35e calc(var(--p)*1%),var(--surface-3) 0)}
.fast-ring.done .fast-time{color:#46a35e}
.fast-since{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
.ft-col b.done{color:#46a35e}
.fast-edit{display:block;width:100%;background:none;border:0;color:var(--cyan);font-size:13px;font-weight:600;padding:2px 0 6px;cursor:pointer}
.fast-edit:active{opacity:.6}
.fe-dur{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
.sleep-dbg{font-size:11px;color:var(--faint);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:6px 0 2px;line-height:1.5;word-break:break-word}
.food-results{margin-top:10px;max-height:40vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.food-opt{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;text-align:left;color:var(--fg)}
.food-opt:active{border-color:var(--primary)}
.food-opt.sel{border-color:var(--primary);background:rgba(255,58,34,.07)}
.fo-check{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.8px solid var(--line);background:var(--surface);color:#fff;font-size:14px;font-weight:800;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer}
.food-opt.sel .fo-check{background:var(--primary);border-color:var(--primary)}
.fo-main[data-pick]{cursor:pointer}
.multi-bar{position:sticky;top:0;z-index:2}
.fo-main{flex:1;min-width:0}
.fo-main b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fo-main span{font-size:11px;color:var(--faint)}
.fo-k{font-family:var(--font-display);font-size:18px;color:var(--primary);flex:0 0 auto}
.custom-food{display:flex;flex-direction:column;gap:8px}
.custom-food input{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--fg)}
.custom-food input:focus{outline:0;border-color:var(--primary)}
.cf-row{display:flex;gap:8px}
.cf-row input{flex:1;min-width:0;text-align:center}
.body-card{display:flex;flex-direction:column;gap:10px}
.body-row{display:flex;align-items:center;gap:12px}
.body-row label{flex:1;font-weight:700;font-size:14px}
.body-row label small{color:var(--faint);font-weight:800}
.body-row input{width:118px;flex:0 0 auto;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;text-align:center;color:var(--fg);color-scheme:light;-moz-appearance:textfield}
.body-row input::-webkit-outer-spin-button,.body-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.body-row input:focus{outline:0;border-color:var(--primary)}

/* fasting + extras */
.fast-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 13px;margin-bottom:12px}
.fast-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.fast-proto{background:var(--surface-2);border:1px solid var(--line);color:var(--primary);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;flex:0 0 auto}
.fast-target{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:800;text-align:right;min-width:48px;line-height:1.4}
.fast-ring{--p:0;position:relative;width:120px;height:120px;flex:0 0 auto;border-radius:50%;background:var(--surface-3);display:grid;place-items:center}
.fast-ring.on{background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface-3) 0)}
.fast-inner{width:99px;height:99px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8px;overflow:hidden}
.fast-lbl{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:800}
.fast-time{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--cyan);line-height:1.1;margin-top:2px;white-space:nowrap}
.fast-ring.on .fast-time{color:var(--primary)}
.fast-end{background:var(--surface-2)!important;border:1px solid var(--line)!important;color:var(--fg)!important}
.fast-card.past{padding:14px 16px}
.fast-past-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.fast-past-head span{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:800}
.fast-past-head b{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--cyan)}
.bp-log .bp-row{display:flex;align-items:flex-end;gap:10px}
.bp-log label{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.bp-log label span{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:800}
.bp-log input{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;text-align:center;color:var(--fg);color-scheme:light;width:100%;-moz-appearance:textfield}
.bp-log input:focus{outline:0;border-color:var(--primary)}
.bp-slash{font-family:var(--font-display);font-size:22px;color:var(--faint);padding-bottom:8px}
.fast-times{display:flex;align-items:center;justify-content:center;gap:14px;margin:2px 0 8px;padding:9px 12px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.fast-times.idle{opacity:.85}
.ft-col{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ft-col span{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:800}
.ft-col b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.ft-col b.done{color:var(--lime)}
.ft-arrow{color:var(--primary);font-weight:800;font-size:16px}
.proto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.proto-opt{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 6px;font-weight:800;font-size:16px;color:var(--fg);display:flex;flex-direction:column;gap:3px;align-items:center}
.proto-opt small{font-size:10px;color:var(--faint);font-weight:700}
.proto-opt.on{border-color:var(--primary);background:rgba(255,58,34,.1);color:var(--primary)}

/* portion editor + goals + overflow fixes */
.portion{padding:4px 0}
.portion-name{font-weight:800;font-size:16px;margin-bottom:4px;overflow-wrap:anywhere}
.portion-sub{font-size:12px;color:var(--faint);margin-bottom:14px}
.portion-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.portion-row>span{font-weight:700}
.qty{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.qty button{border:0;background:transparent;width:44px;height:46px;font-size:21px;font-weight:800;color:var(--fg)}
.qty input{width:66px;text-align:center;background:transparent;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);font-size:17px;font-weight:800;color:var(--fg);-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.portion-calc{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center;font-size:13.5px;color:var(--muted);margin-bottom:14px}
.portion-calc b{font-family:var(--font-display);font-size:20px;color:var(--primary)}
.goal-row{display:flex;align-items:center;gap:12px;margin-top:10px}
.goal-row label{flex:1;min-width:0;font-weight:700;display:flex;align-items:center;gap:8px}
.goal-row input{width:108px;flex:0 0 auto;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;text-align:center;color:var(--fg)}
.goal-row input:focus{outline:0;border-color:var(--primary)}
.dotc{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto}
.dotc.c{background:#628078}.dotc.p{background:#ff3a22}.dotc.f{background:#a4893d}
.goal-calc{margin-top:12px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
.goal-calc b{color:var(--fg)}
.goal-calc .warn{color:var(--danger);font-weight:800}
/* overflow safety across the app */
.cal-side,.fr-main,.fo-main,.mini-main,.body-row label,.macros{min-width:0}
.meal-mini{min-width:0}
.meal-mini span{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mc{white-space:nowrap}
.fast-top{min-width:0}
.fast-inner{padding:0 8px}
.fast-lbl{max-width:94px;white-space:normal;line-height:1.22}
.fr-main span,.fo-main span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.hist-head .date small{overflow-wrap:anywhere}

/* health sync */
.sync-btn{margin-left:auto;background:var(--surface-2);border:1px solid var(--line);color:var(--primary);border-radius:999px;padding:5px 12px;font-weight:800;font-size:11px;letter-spacing:.3px}
.sync-btn:active{transform:scale(.95)}
.sync-note{font-size:11px;color:var(--faint);font-weight:700;margin:8px 2px 14px;line-height:1.5}
</style>

const KEY_DRAFT="ironlog.draft.v1";
function saveDraft(){
  try{session?localStorage.setItem(KEY_DRAFT,JSON.stringify(session)):localStorage.removeItem(KEY_DRAFT);}catch(e){}
  const tag=document.getElementById("savedTag");
  if(tag&&session)tag.textContent="✓ Auto-saved "+new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function loadDraft(){try{const r=localStorage.getItem(KEY_DRAFT);if(r)return JSON.parse(r);}catch(e){}return null;}
function clearDraft(){try{localStorage.removeItem(KEY_DRAFT);}catch(e){}}

    if(!Object.keys(mk).length)delete state.bodyManual[k];}

  // Connect had its own records. Repair: on every seeded day (present in CAL_HISTORY),
  // drop any sync-written body-measurement override so the real baked value shows again.
  const typed=["weight","waist","hip","chest","bps","bpd"];
  for(const k in state.body){const h=CAL_HISTORY[k];if(!h)continue;
    typed.forEach(f=>{if(h[f]!=null)delete state.body[k][f];});
    if(!Object.keys(state.body[k]).length)delete state.body[k];}
  state.settings.manualResetV2=1;state.settings.manualResetV3=1;
}

function num(x){x=(""+(x==null?'':x)).replace(/[‒-―]/g,'').trim();if(x===''||x==='-')return null;const n=parseFloat(x);return isFinite(n)?n:null;}
function round1(n){return Math.round(n*10)/10;}
function hm(h){if(h==null||isNaN(h))return '–';const t=Math.max(0,Math.round(h*60)),H=Math.floor(t/60),M=t%60;return H>0?(M>0?`${H}h ${M}m`:`${H}h`):`${M}m`;}
function fmtNum(v){if(v==null||typeof v!=="number"||!isFinite(v))return v;

/* ---------- date helpers ---------- */
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}
function mondayOf(d){const x=startOfDay(d);const g=(x.getDay()+6)%7;x.setDate(x.getDate()-g);return x;}
function sameDay(a,b){return startOfDay(a).getTime()===startOfDay(b).getTime();}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString(undefined,{day:"numeric",month:"short"});}
function fmtDow(iso){return new Date(iso).toLocaleDateString(undefined,{weekday:"short"});}
function fmtTime(iso){return new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}
function localDatetimeValue(d){ // -> "YYYY-MM-DDTHH:MM" in local time for <input type=datetime-local>
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function daysAgo(iso){const d=Math.round((startOfDay(Date.now())-startOfDay(iso))/864e5);
  return d===0?"Today":d===1?"Yesterday":d+" days ago";}

/* ---------- derived stats ---------- */
function workoutVolumeKg(w){let v=0;w.exercises.forEach(ex=>(ex.sets||[]).forEach(s=>{
  if(s.reps!=null&&s.weightKg!=null)v+=s.reps*s.weightKg;}));return v;}
function trackedKg(ex){ // last of set3/set4 with a weight
  if(ex.type==="cardio"||!ex.sets)return null;
  const s4=ex.sets[3], s3=ex.sets[2];
  if(s4&&s4.weightKg!=null)return s4.weightKg;
  if(s3&&s3.weightKg!=null)return s3.weightKg;
  // fallback: heaviest filled set
  let m=null;ex.sets.forEach(s=>{if(s.weightKg!=null)m=(m==null?s.weightKg:Math.max(m,s.weightKg));});
  return m;
}
function allExerciseNames(){const set=new Set();
  state.workouts.forEach(w=>w.exercises.forEach(ex=>{if(ex.name)set.add(ex.name);}));
  return [...set].sort((a,b)=>a.localeCompare(b));}
function seriesFor(name){ // [{date, kg}] sorted asc
  const out=[];
  state.workouts.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(w=>{
    w.exercises.forEach(ex=>{if(ex.name===name){const k=trackedKg(ex);if(k!=null)out.push({date:w.date,kg:k});}});
  });
  return out;
}
function bestKg(name){let m=null;seriesFor(name).forEach(p=>{m=(m==null?p.kg:Math.max(m,p.kg));});return m;}
function weeklyStreak(){ // consecutive weeks (incl current) with >=1 workout
  if(!state.workouts.length)return 0;
  const weeks=new Set(state.workouts.map(w=>mondayOf(w.date).getTime()));
  let cur=mondayOf(Date.now()).getTime(), streak=0;
  // allow current week to be empty without breaking (grace)
  if(!weeks.has(cur)){cur-=7*864e5; if(!weeks.has(cur))return 0;}
  while(weeks.has(cur)){streak++;cur-=7*864e5;}
  return streak;
}
function thisWeekCount(){const m=mondayOf(Date.now()).getTime();
  return state.workouts.filter(w=>mondayOf(w.date).getTime()===m).length;}
function totalVolumeKg(){return state.workouts.reduce((a,w)=>a+workoutVolumeKg(w),0);}

/* ---------- Streaks & badges (three independent streaks) ---------- */
const STEP_GOAL=6500, WATER_REMINDER=4000;
function mealsLoggedOn(date){const fd=foodDay(date);if(!fd)return 0;let n=0;MEALS.forEach(m=>{if(fd[m]&&fd[m].length)n++;});return n;}
function dayComplete(date){if(mealsLoggedOn(date)>=3)return true;const h=histFor(date);return !!(h&&h.kcal);} // ≥3 meals, or an imported day you tracked
function stepsOk(date){const s=bodyVal(date,'steps');return s!=null&&+s>=STEP_GOAL;}
function workoutsInWeek(monday){return state.workouts.filter(w=>mondayOf(w.date).getTime()===monday).length;}
// Generic consecutive-DAY streak for a predicate, with one forgiven gap (streak freeze).
// Today still in progress is not counted against you.
function dayStreak(ok){
  let d=startOfDay(Date.now());
  if(!ok(d))d=startOfDay(+d-864e5);
  let n=0, grace=true;
  while(true){ if(ok(d)){n++;d=startOfDay(+d-864e5);} else if(grace){grace=false;d=startOfDay(+d-864e5);} else break; }
  return n;
}
function mealStreak(){return dayStreak(dayComplete);}                 // days with 3+ meals
function stepStreak(){return dayStreak(stepsOk);}                     // days with 6,500+ steps
// Workout streak is weekly by nature: consecutive weeks with 3+ workouts (current week forgiven).
function workoutStreak(){
  const cnt=mon=>workoutsInWeek(mon);
  let cur=mondayOf(Date.now()).getTime(), n=0, grace=true;
  while(true){ if(cnt(cur)>=3){n++;cur-=7*864e5;} else if(grace){grace=false;cur-=7*864e5;} else break; }
  return n;
}
const DAY_BADGES=[[7,'7-day','🔥'],[15,'15-day','⚡'],[21,'3-week','💪'],[30,'1-month','🏆'],[60,'2-month','🥈'],[90,'3-month','🥇'],[180,'6-month','💎'],[365,'1-year','👑']];
const WK_BADGES=[[2,'2-week','🔥'],[4,'1-month','⚡'],[8,'2-month','💪'],[12,'3-month','🏆'],[26,'6-month','💎'],[52,'1-year','👑']];
function badgeFor(n,def){let b=null;for(const x of def){if(n>=x[0])b=x;}return b;}
function nextBadgeFor(n,def){for(const x of def){if(n<x[0])return x;}return null;}
// What's still missing for today — mirrors the 8pm reminder.
function todayChecklist(){
  const d=Date.now();const meals=mealsLoggedOn(d);const water=waterTotal(d);
  const ft=foodTotals(d);const g=macroGoals();
  const carbsOver=!!(g&&g.c&&ft.c>g.c);
  const miss=[];
  if(meals<4)miss.push(`${4-meals} meal${4-meals>1?'s':''} not logged`);
  if(water<WATER_REMINDER)miss.push(`Water ${fmtNum(water)}/${fmtNum(WATER_REMINDER)} ml`);
  const missVit=[['weight','Weight'],['steps','Steps'],['sleep','Sleep'],['hrv','HRV']].filter(v=>bodyVal(d,v[0])==null).map(v=>v[1]);
  if(missVit.length)miss.push(missVit.join(', ')+' not logged');
  return {meals,water,carbsOver,carbs:ft.c,carbGoal:g&&g.c,miss};
}

// Confetti celebration that fades after 15 s.
let _confettiOn=false;
function celebrate(label){
  if(_confettiOn)return;_confettiOn=true;
  const wrap=document.createElement('div');wrap.className='confetti-wrap';
  wrap.innerHTML=`<canvas></canvas><div class="confetti-msg">🎉 <b>${esc(label)}</b><small>Keep the streak alive</small></div>`;
  document.body.appendChild(wrap);
  const cv=wrap.querySelector('canvas'),ctx=cv.getContext('2d');
  let W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cols=['#ff3a22','#c7af6b','#628078','#a4893d','#46a35e','#3b9ec4'];
  const P=Array.from({length:150},()=>({x:Math.random()*W,y:-20-Math.random()*H*0.4,r:4+Math.random()*6,
    c:cols[(Math.random()*cols.length)|0],vy:2+Math.random()*3.5,vx:-1.2+Math.random()*2.4,a:Math.random()*6,va:-0.2+Math.random()*0.4}));
  let raf,stopped=false;
  const draw=()=>{if(stopped)return;ctx.clearRect(0,0,W,H);
    P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=p.va;if(p.y>H+20){p.y=-20;p.x=Math.random()*W;}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore();});
    raf=requestAnimationFrame(draw);};
  draw();
  const fade=()=>{if(stopped)return;stopped=true;cancelAnimationFrame(raf);wrap.style.opacity='0';setTimeout(()=>{wrap.remove();_confettiOn=false;},700);};
  wrap.addEventListener('click',fade);
  setTimeout(fade,15000);
}
// Compact one-line streak tile (three sit side by side).
function miniStreak(icon,label,n,unit,def){
  const cur=badgeFor(n,def), nx=nextBadgeFor(n,def);

  return `<div class="ms-tile">

    <div class="ms-n tnum">${n}<small>${unit}</small></div>
    <div class="ms-l">${label}</div>

    <div class="ms-next">${nx?`+${Math.max(0,nx[0]-n)}${unit} ${nx[2]}`:'👑 max'}</div>

}

function maybeCelebrate(ms,ss,ws){
  state.settings.lastBadge=state.settings.lastBadge||{};
  const checks=[
    ['meal',badgeFor(ms,DAY_BADGES),'meal-logging streak'],
    ['step',badgeFor(ss,DAY_BADGES),'step streak'],
    ['workout',badgeFor(ws,WK_BADGES),'workout streak']];
  for(const [key,b,name] of checks){
    const cur=b?b[0]:0;const last=state.settings.lastBadge[key]||0;
    if(cur>last){state.settings.lastBadge[key]=cur;save();

  }
}

    while(sets.length<SETS_PER_EX)sets.push({reps:DEFAULT_REPS,weight:""});
    return {name:ex.name||"",label:"",open:!ex.name,type:"strength",cardio:{distance:"",duration:"",speed:""},sets};
  });
  session={templateId:w.templateId||Object.keys(TEMPLATES)[0], startedAt:Date.now(),
    when:localDatetimeValue(new Date(w.date)), timer:{running:false,elapsedBefore:0,startedAt:null},
    exercises, note:w.note||"", editingId:id};
  saveDraft();startAutoSave();setTab("log");
  toast("Editing session — Finish to save changes");
}
function newSession(tplId){
  const t=TEMPLATES[tplId];
  const exercises=t.exercises.map(e=>{
    const obj = (typeof e==="object") ? e : {name:e, open:false};
    const name = obj.name||"";
    const open = obj.open!==undefined ? !!obj.open : (name==="");
    const label = obj.label||"";
    const type = obj.type||"strength";
    return {name, label, open, type, cardio:{distance:"",duration:""},
      sets:Array.from({length:SETS_PER_EX},()=>({reps:DEFAULT_REPS,weight:""}))};
  });
  return {templateId:tplId, startedAt:Date.now(), when:localDatetimeValue(new Date()),
    timer:{running:false, elapsedBefore:0, startedAt:null}, exercises, note:""};
}

const CARDIO_MACHINES=['SkiErg','Row','Treadmill','Stepper'];
function cardioSummary(c){
  const d=parseFloat(c&&c.distance), t=parseFloat(c&&c.duration), s=parseFloat(c&&c.speed);
  const parts=[];
  if(isFinite(s)&&s>0)parts.push(`${round1(s)} km/h`);
  if(isFinite(d)&&d>0&&isFinite(t)&&t>0){const p=t/d;const m=Math.floor(p);const ss=Math.round((p-m)*60);
    parts.push(`${m}:${String(ss).padStart(2,"0")} /km`);}
  return parts.join('  ·  ');
}
function paceStr(c){return cardioSummary(c);}
// Distance (km), Time (min), Speed (km/h) are interdependent. Whenever two have
// been entered, deduce the third. The derived one is the field NOT among the two
// most recently edited, so editing any field recomputes the stalest one.
function cardioDeduce(ex){
  const c=ex.cardio;if(!c)return null;
  const all=['distance','duration','speed'];
  let inputs=(c._last||[]).filter(k=>all.includes(k)).slice(0,2);
  if(inputs.length<2)inputs=all.filter(k=>c[k]!==""&&isFinite(parseFloat(c[k]))).slice(0,2);
  if(inputs.length<2)return null;
  const derived=all.find(k=>!inputs.includes(k));
  const d=parseFloat(c.distance), t=parseFloat(c.duration), s=parseFloat(c.speed);
  let v=null;
  if(derived==='speed'&&isFinite(d)&&isFinite(t)&&t>0)v=d*60/t;
  else if(derived==='duration'&&isFinite(d)&&isFinite(s)&&s>0)v=d/s*60;
  else if(derived==='distance'&&isFinite(s)&&isFinite(t))v=s*t/60;
  if(v==null||!isFinite(v)||v<0)return null;
  return {field:derived, value:(derived==='distance'?round2(v):round1(v))};
}
function renderExBlock(ex,i){
  const type=ex.type||"strength";
  const best=(type==="strength"&&ex.name)?bestKg(ex.name):null;
  const bestD=best!=null?`<span class="ex-best">PB <b>${Math.round(fromKg(best))}${unitLbl()}</b></span>`:"";
  const toggle= ex.open ? `<div class="type-toggle" data-ex="${i}">
      <button class="${type==='strength'?'on':''}" data-type="strength">💪 Strength</button>
      <button class="${type==='cardio'?'on':''}" data-type="cardio">🏃 Cardio</button>
    </div>` : "";
  let bodyHtml;
  if(type==="cardio"){
    const c=ex.cardio||{distance:"",duration:"",speed:""};
    const dv=(c._last||[]).slice(0,2);  // which two were last edited (the third is derived)
    const der=['distance','duration','speed'].find(k=>dv.length>=2&&!dv.includes(k)&&c[k]!=="");
    const chips=CARDIO_MACHINES.map(mn=>`<button class="cardio-chip${(ex.name||'').toLowerCase()===mn.toLowerCase()?' on':''}" data-cardio-machine="${i}" data-name="${esc(mn)}">${mn}</button>`).join("");
    const fld=(key,lbl)=>`<label class="cfield"><span>${lbl}</span><input type="number" inputmode="decimal" class="${der===key?'derived':''}" data-ex="${i}" data-f="${key}" value="${esc(c[key]||'')}"></label>`;
    bodyHtml=`<div class="cardio-chips">${chips}</div>
    <div class="cardio-grid3">
      ${fld('distance','Distance (km)')}
      ${fld('duration','Time (min)')}
      ${fld('speed','Speed (km/h)')}
    </div>
    <div class="pace" id="pace-${i}">${cardioSummary(c)}</div>`;
  }else{
    let rows="";
    for(let s=0;s<ex.sets.length;s++){
      const st=ex.sets[s];
      const isTrack=(s===3&&st.weight!=="")||(s===2&&ex.sets[3].weight===""&&st.weight!=="");
      rows+=`<div class="set-row">

        <input type="number" inputmode="numeric" placeholder="reps" class="${st.reps!==''?'filled':''}" data-ex="${i}" data-set="${s}" data-f="reps" value="${esc(st.reps)}">
        <input type="number" inputmode="decimal" class="${st.weight!==''?'filled':''}" data-ex="${i}" data-set="${s}" data-f="weight" value="${esc(st.weight)}">
        <div class="track ${isTrack?'':'off'}">●</div>
      </div>`;
    }
    bodyHtml=`<div class="sets-head"><span>Set</span><span>Reps</span><span>Weight <button class="wunit-btn${session.lbInput?' lb':''}" data-wunit title="Enter in pounds (converts to kg)">${session.lbInput?'lb→kg':unitLbl()}</button></span><span></span></div>${rows}`;
  }
  return `<div class="ex-block">
    <div class="ex-top">
      <div class="ex-num">${i+1}</div>
      <input class="ex-name ${ex.open?'open':''}" data-ex="${i}" data-f="name" placeholder="${esc(ex.label||(type==='cardio'?'Run, row, bike…':'Exercise name'))}" value="${esc(ex.name)}">
      ${bestD}
      <button class="ex-del" data-del-ex="${i}" title="Remove exercise" aria-label="Remove exercise">×</button>
    </div>
    ${toggle}
    ${bodyHtml}
  </div>`;
}
function wireLogInputs(el){
  $$('input[data-ex]',el).forEach(inp=>{
    inp.addEventListener("input",()=>{
      const i=+inp.dataset.ex, f=inp.dataset.f, ex=session.exercises[i];
      if(f==="name"){ex.name=inp.value;}
      else if(f==="distance"||f==="duration"||f==="speed"){
        ex.cardio=ex.cardio||{distance:"",duration:"",speed:""};
        ex.cardio[f]=inp.value;
        ex.cardio._last=[f].concat((ex.cardio._last||[]).filter(k=>k!==f)).slice(0,2);
        const dd=cardioDeduce(ex);
        $$('input[data-ex="'+i+'"][data-f]',el).forEach(x=>x.classList.remove('derived'));
        if(dd){ex.cardio[dd.field]=String(dd.value);
          const other=el.querySelector('input[data-ex="'+i+'"][data-f="'+dd.field+'"]');
          if(other&&document.activeElement!==other){other.value=dd.value;other.classList.add('derived');}}
        const pc=document.getElementById("pace-"+i);if(pc)pc.textContent=cardioSummary(ex.cardio);}
      else{const s=+inp.dataset.set;ex.sets[s][f]=inp.value;
        inp.classList.toggle("filled",inp.value!=="");
        updateTrackDots(el,i);}
      saveDraft();
    });
    // When "lb" input is on, a weight typed as pounds is converted to kg the moment
    // you leave the field — so the logged value is always kg.
    if(inp.dataset.f==="weight"){
      inp.addEventListener("change",()=>{
        if(!session.lbInput)return;
        const lb=num(inp.value);if(lb==null)return;
        const kg=round1(fromKg(lb*KG_PER_LB));
        const s=+inp.dataset.set, i=+inp.dataset.ex;
        inp.value=kg;session.exercises[i].sets[s].weight=String(kg);saveDraft();
        if(typeof toast==="function")toast(`${lb} lb → ${kg} ${unitLbl()}`);
      });
    }
  });
  $$('[data-wunit]',el).forEach(b=>b.addEventListener("click",()=>{
    session.lbInput=!session.lbInput;saveDraft();renderLog();
    if(typeof toast==="function")toast(session.lbInput?"Enter weights in lb — they'll convert to kg":"Back to kg entry");
  }));
  $$('.type-toggle button',el).forEach(b=>b.addEventListener("click",()=>{
    const i=+b.parentElement.dataset.ex;
    session.exercises[i].type=b.dataset.type;saveDraft();renderLog();
  }));
  $$('[data-cardio-machine]',el).forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.cardioMachine;session.exercises[i].name=b.dataset.name;saveDraft();renderLog();
  }));
  $$('.ex-del',el).forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.delEx;session.exercises.splice(i,1);saveDraft();renderLog();
  }));
}
function updateTrackDots(el,i){
  const block=$$('.ex-block',el)[i];if(!block)return;
  const ex=session.exercises[i];
  $$('.set-row .track',block).forEach((d,s)=>{
    const st=ex.sets[s];
    const isTrack=(s===3&&st.weight!=="")||(s===2&&ex.sets[3].weight===""&&st.weight!=="");
    d.classList.toggle("off",!isTrack);
  });
}
function sessionHasData(){return session&&session.exercises.some(ex=>ex.sets.some(s=>s.reps!==""||s.weight!==""));}

/* session timer — manual start/pause */
let sessInt=null;
function timerElapsed(){
  if(!session||!session.timer)return 0;
  const t=session.timer;let e=t.elapsedBefore||0;
  if(t.running&&t.startedAt)e+=(Date.now()-t.startedAt)/1000;
  return Math.floor(e);
}
function startSessTimer(){stopSessTimer();if(!session)return;
  const tick=()=>{const t=$("#sessTimer");if(!t){stopSessTimer();return;}
    const s=timerElapsed();
    t.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
    t.classList.toggle("run", !!(session.timer&&session.timer.running));};
  tick();sessInt=setInterval(tick,1000);}
function stopSessTimer(){if(sessInt){clearInterval(sessInt);sessInt=null;}}
function startTimer(){if(!session)return;const t=session.timer;if(t.running)return;
  t.running=true;t.startedAt=Date.now();saveDraft();updateTimerBtn();}
function pauseTimer(){if(!session)return;const t=session.timer;if(!t.running)return;
  t.elapsedBefore=(t.elapsedBefore||0)+(Date.now()-t.startedAt)/1000;t.running=false;t.startedAt=null;saveDraft();updateTimerBtn();}
function toggleTimer(){if(!session)return;session.timer.running?pauseTimer():startTimer();}
function updateTimerBtn(){const b=$("#startTimerBtn");if(!b)return;
  const r=session&&session.timer&&session.timer.running;
  b.textContent=r?"⏸ Pause":(timerElapsed()>0?"▶ Resume":"▶ Start");
  b.classList.toggle("running",!!r);}

/* rest timer */
let restInt=null, restLeft=0;
function toggleRest(){
  const btn=$("#restBtn");if(!btn)return;
  if(restInt){clearInterval(restInt);restInt=null;btn.classList.remove("active");$("#restLbl").textContent="90s";return;}
  restLeft=90;btn.classList.add("active");$("#restLbl").textContent=restLeft+"s";
  restInt=setInterval(()=>{restLeft--;const l=$("#restLbl");
    if(l)l.textContent=restLeft+"s";
    if(restLeft<=0){clearInterval(restInt);restInt=null;
      try{navigator.vibrate&&navigator.vibrate([200,80,200]);}catch(e){}
      const b=$("#restBtn");if(b){b.classList.remove("active");$("#restLbl").textContent="Done!";setTimeout(()=>{const x=$("#restLbl");if(x)x.textContent="90s";},1500);}
      toast("⏱ Rest over — go!");}
  },1000);
}

/* ---------- finish / save ---------- */
function finishWorkout(sendGarmin){
  if(!session){return;}
  // build clean workout
  const exercises=[];
  session.exercises.forEach(ex=>{
    const name=(ex.name||"").trim();
    if(!name)return;
    if((ex.type||"strength")==="cardio"){
      const dist=num((ex.cardio||{}).distance), dur=num((ex.cardio||{}).duration), spd=num((ex.cardio||{}).speed);
      if(dist!=null||dur!=null||spd!=null) exercises.push({name,type:"cardio",cardio:{distanceKm:dist,durationMin:dur,speedKmh:spd}});
    }else{
      const sets=ex.sets.map(s=>{
        const r=s.reps!==""?num(s.reps):null;
        const w=s.weight!==""?toKg(num(s.weight)):null;
        return {reps:r, weightKg:w, _perf:(w!=null)||(r!=null&&s.reps!==DEFAULT_REPS)};
      });
      if(sets.some(s=>s._perf)) exercises.push({name,type:"strength",sets:sets.map(s=>({reps:s.reps,weightKg:s.weightKg}))});
    }
  });
  if(!exercises.length){toast("Add a weight, or a cardio distance/time first");return;}
  let when=session.when?new Date(session.when):new Date();
  if(isNaN(when.getTime()))when=new Date();
  const liveSec=timerElapsed();
  const isPast=Math.abs(Date.now()-when.getTime())>36e5; // >1h from now = a past log
  const origW=session.editingId?state.workouts.find(w=>w.id===session.editingId):null;
  // Editing a saved session shouldn't zero its duration just because the timer didn't run.
  const durationSec=(origW&&liveSec<2)?(origW.durationSec||0):(isPast?0:liveSec);
  // PR detection against existing history
  const prs=[];
  exercises.forEach(ex=>{const prev=bestKg(ex.name);const now=trackedKg(ex);
    if(now!=null && (prev==null||now>prev)) prs.push({name:ex.name, kg:now});});
  const workout={id:session.editingId||("w"+Date.now()+Math.random().toString(36).slice(2,6)),
    date:when.toISOString(), templateId:session.templateId, durationSec, note:session.note||"",
    exercises, prs:prs.map(p=>p.name)};
  if(session.editingId){const idx=state.workouts.findIndex(w=>w.id===session.editingId);
    if(idx>=0)state.workouts[idx]=workout; else state.workouts.push(workout);}
  else state.workouts.push(workout);
  save();

  const hadPR=prs.length>0;
  session=null;stopSessTimer();stopAutoSave();clearDraft();
  setTab("home");
  if(hadPR){prCelebrate(prs);}
  else {toast("Session saved 💪");}
  renderGraphs();
}
function prCelebrate(prs){
  const t=$("#toast");t.className="show pr";
  t.textContent=`★ NEW PR! ${prs.map(p=>p.name).slice(0,2).join(", ")}${prs.length>2?` +${prs.length-2}`:''}`;
  confetti();
  setTimeout(()=>{t.className="";},2600);
}
function toast(msg){const t=$("#toast");t.className="show";t.textContent=msg;
  clearTimeout(t._t);t._t=setTimeout(()=>{t.className="";},2200);}
// Toast with an Undo action (used after deleting a logged food).
function toastUndo(msg,onUndo){const t=$("#toast");t.className="show undo";
  t.innerHTML=`<span>${esc(msg)}</span><button class="toast-undo">Undo</button>`;
  clearTimeout(t._t);
  const hide=()=>{t.className="";t.textContent="";};
  t._t=setTimeout(hide,5000);
  const b=t.querySelector('.toast-undo');
  if(b)b.addEventListener('click',()=>{clearTimeout(t._t);hide();try{onUndo();}catch(e){}});}

/* lightweight confetti (no lib) */
function confetti(){
  const cols=["#ff3a22","#628078","#c7af6b","#a4893d","#ff6a55"];
  const c=document.createElement("div");
  c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden";
  document.body.appendChild(c);
  for(let i=0;i<70;i++){const p=document.createElement("div");
    const size=6+Math.random()*7;
    p.style.cssText=`position:absolute;top:-14px;left:${Math.random()*100}%;width:${size}px;height:${size*0.5}px;
      background:${cols[i%cols.length]};opacity:.95;border-radius:2px;
      transform:rotate(${Math.random()*360}deg)`;
    const dur=1100+Math.random()*1200, x=(Math.random()-.5)*160;
    p.animate([{transform:`translate(0,0) rotate(0)`,opacity:1},
      {transform:`translate(${x}px,${window.innerHeight+40}px) rotate(${540+Math.random()*540}deg)`,opacity:.9}],
      {duration:dur,easing:"cubic-bezier(.2,.6,.4,1)"});
    c.appendChild(p);}
  setTimeout(()=>c.remove(),2600);
}

  {k:"bp",label:"Blood pressure",unit:()=>"mmHg",color:"#ff3a22",bp:true},
  {k:"jab",label:"Jab",unit:()=>"mg",color:"#a4893d"},
  {k:"hrv",label:"HRV",unit:()=>"ms",color:"#628078"},
  {k:"fast",label:"Fasting Hours",unit:()=>"h",color:"#c7af6b"}
];
// Training days as yes/no: 1 on days with a logged workout, 0 otherwise, one point
// per day for the past year (the range selector trims it to the chosen window).
function trainingDays(){
  const set=new Set(state.workouts.map(w=>dkey(w.date)));
  const today=startOfDay(Date.now());const out=[];
  for(let i=365;i>=0;i--){const d=dkey(today-i*864e5);out.push({date:d,val:set.has(d)?1:0});}
  return out;
}
function metricPoints(k){
  if(k==="train")return trainingDays();
  if(k==="kcal")return kcalDaily();
  if(k==="cardioDist")return cardioDaily("dist");
  if(k==="cardioPace")return cardioDaily("pace");
  if(k==="fast")return fastingSeries();
  if(k==="bp")return mergedDaily("bps");
  const m=METRICS.find(x=>x.k===k);const s=mergedDaily(k);
  return (m&&m.conv)? s.map(p=>({date:p.date,val:m.conv(p.val)})) : s;
}
function cardioDaily(mode){
  const dd={},du={};
  state.workouts.forEach(w=>{const key=dkey(w.date);(w.exercises||[]).forEach(ex=>{
    if(ex.type==="cardio"&&ex.cardio){
      if(ex.cardio.distanceKm!=null)dd[key]=(dd[key]||0)+ex.cardio.distanceKm;
      if(ex.cardio.durationMin!=null)du[key]=(du[key]||0)+ex.cardio.durationMin;}});});
  if(mode==="dist")return Object.keys(dd).sort().map(k=>({date:k,val:round1(dd[k])}));
  return Object.keys(dd).filter(k=>dd[k]>0&&du[k]!=null).sort().map(k=>({date:k,val:round1(du[k]/dd[k])}));
}
function fastingSeries(){return (state.fasting.history||[]).map(f=>({date:dkey(f.end),val:round1((f.end-f.start)/3600000)})).sort((a,b)=>a.date<b.date?-1:1);}
const RANGES=[["week","1W"],["month","1M"],["q","3M"],["year","1Y"],["custom","Custom"]];
function rangeBounds(){
  const today=dkey(Date.now());
  if(graphRange==="custom")return {from:graphCustom.from,to:graphCustom.to||today};
  const days={week:7,month:30,q:90,year:365}[graphRange]||7;
  return {from:dkey(startOfDay(Date.now())-((days-1)*864e5)),to:today};
}
function filterRange(pts){const b=rangeBounds();
  return pts.filter(p=>(!b.from||p.date>=b.from)&&(!b.to||p.date<=b.to));}
function rangeLabel(){
  const names={week:"last 7 days",month:"last 30 days",q:"last 3 months",year:"last year"};
  if(graphRange==="custom"){const b=rangeBounds();return (b.from||"start")+" → "+(b.to||"today");}
  return names[graphRange]||"";
}

function renderGraphs(){

function trendSummary(){
  return METRICS.map(m=>{
    if(m.k==="bp"){const sys=filterRange(mergedDaily("bps")),dia=filterRange(mergedDaily("bpd"));if(!sys.length)return "";
      const ls=sys[sys.length-1].val,ld=dia.length?dia[dia.length-1].val:null,dd=round1(ls-sys[0].val);
      const bcls=dd===0?'flat':(dd<0?'up':'down');const barrow=dd>0?`▲ ${fmtNum(Math.abs(dd))}`:dd<0?`▼ ${fmtNum(Math.abs(dd))}`:'—';
      return `<div class="prog-item"><div class="nm">Blood pressure</div><div class="bw tnum">${fmtNum(ls)}${ld!=null?'/'+fmtNum(ld):''}<small> mmHg</small></div><div class="chg ${bcls}">${barrow}</div></div>`;}
    if(m.k==="train"){const pts=filterRange(metricPoints("train"));const trained=pts.filter(p=>p.val>0).length;
      return `<div class="prog-item"><div class="nm">Training days</div><div class="bw tnum">${trained}<small> / ${pts.length}</small></div><div class="chg ${trained>0?'up':'flat'}">${trained} trained</div></div>`;}
    const pts=filterRange(metricPoints(m.k));if(!pts.length)return "";
    const last=pts[pts.length-1].val, first=pts[0].val, d=round1(last-first);
    const lowerBetter=(m.k==="weight"||m.k==="waist"||m.k==="hip"||m.k==="kcal"||m.k==="cardioPace"||m.k==="bp");
    const cls=d===0?'flat':((d<0)===lowerBetter?'up':'down');
    const arrow=d>0?`▲ ${fmtNum(Math.abs(d))}`:d<0?`▼ ${fmtNum(Math.abs(d))}`:'—';
    return `<div class="prog-item"><div class="nm">${m.label}</div><div class="bw tnum">${fmtNum(last)}<small> ${m.unit()}</small></div><div class="chg ${cls}">${arrow}</div></div>`;
  }).join("");
}
function drawBP(){
  const cv=$("#chart");if(!cv||!window.Chart)return;
  const sys=filterRange(mergedDaily("bps")),dia=filterRange(mergedDaily("bpd"));
  const dates=[...new Set(sys.map(p=>p.date).concat(dia.map(p=>p.date)))].sort();
  const mS={},mD={};sys.forEach(p=>mS[p.date]=p.val);dia.forEach(p=>mD[p.date]=p.val);
  const dataS=dates.map(d=>d in mS?mS[d]:null),dataD=dates.map(d=>d in mD?mD[d]:null);
  if(chart)chart.destroy();const ctx=cv.getContext("2d");
  chart=new Chart(ctx,{type:"line",data:{labels:dates,datasets:[
    {data:dataS,label:"Systolic",borderColor:"#ff3a22",borderWidth:2.5,tension:.25,fill:false,spanGaps:true,pointRadius:3,pointHoverRadius:5,pointBackgroundColor:"#ff3a22",pointBorderColor:"#ffffff",pointBorderWidth:1.5},
    {data:dataD,label:"Diastolic",borderColor:"#628078",borderWidth:2.5,tension:.25,fill:false,spanGaps:true,pointRadius:3,pointHoverRadius:5,pointBackgroundColor:"#628078",pointBorderColor:"#ffffff",pointBorderWidth:1.5}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:true,labels:{color:"#6c6454",font:{family:"Archivo",weight:"700",size:11},boxWidth:14,boxHeight:3}},
        tooltip:{backgroundColor:"#191714",borderColor:"#3a3630",borderWidth:1,titleColor:"#ffffff",bodyColor:"#e4dfd2",padding:10,callbacks:{title:items=>items.length?fullDMY(items[0].label):'',label:c=>` ${c.dataset.label}: ${fmtNum(c.parsed.y)} mmHg`}}},
      scales:{x:{grid:{color:"rgba(60,40,10,.10)"},ticks:{color:"#9b937f",font:{family:"Archivo",weight:"700",size:10},maxRotation:0,autoSkip:true,maxTicksLimit:7,callback:function(v){return axisDMY(this.getLabelForValue(v));}}},
        y:{grid:{color:"rgba(60,40,10,.10)"},ticks:{color:"#6c6454",font:{family:"Archivo",weight:"700",size:10},callback:v=>fmtNum(v)},grace:"8%"}}}});
}
function drawTrend(){
  const cv=$("#chart");if(!cv||!window.Chart)return;
  if(graphMetric==="bp"){drawBP();return;}
  const isTrain=graphMetric==="train";
  const m=METRICS.find(x=>x.k===graphMetric)||METRICS[0];
  let pts=filterRange(metricPoints(m.k));const label=m.label,unit=m.unit(),color=m.color;
  const labels=pts.map(p=>p.date), data=pts.map(p=>p.val);
  if(chart)chart.destroy();
  const ctx=cv.getContext("2d");
  const grad=ctx.createLinearGradient(0,0,0,230);

    ? {min:0,max:1,grid:{color:"rgba(60,40,10,.10)"},ticks:{color:"#6c6454",font:{family:"Archivo",weight:"700",size:11},stepSize:1,callback:v=>v>=0.5?'Yes':'No'}}
    : {grid:{color:"rgba(60,40,10,.10)"},ticks:{color:"#6c6454",font:{family:"Archivo",weight:"700",size:10},precision:1,callback:v=>fmtNum(v)+(unit||"")},grace:"6%"};
  chart=new Chart(ctx,{type:"line",data:{labels,datasets:[{data,label,borderColor:color,borderWidth:2.5,
    tension:isTrain?0:.25,stepped:isTrain?true:false,fill:true,backgroundColor:grad,pointRadius:isTrain?3:(many?0:3),pointHoverRadius:5,
    pointBackgroundColor:color,pointBorderColor:"#ffffff",pointBorderWidth:1.5}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{backgroundColor:"#191714",borderColor:"#3a3630",borderWidth:1,
        titleColor:"#ffffff",bodyColor:"#e4dfd2",padding:10,callbacks:{
          title:items=>items.length?fullDMY(items[0].label):'',
          label:c=>isTrain?(c.parsed.y>=0.5?' Trained ✓':' Rest day'):` ${fmtNum(c.parsed.y)} ${unit}`}}},
      scales:{x:{grid:{color:"rgba(60,40,10,.10)"},ticks:{color:"#9b937f",font:{family:"Archivo",weight:"700",size:10},
        maxRotation:0,autoSkip:true,maxTicksLimit:7,callback:function(v){return axisDMY(this.getLabelForValue(v));}}},
        y:yScale}}});
}

/* ---- file saving: works inside the sandboxed artifact (downloads capability)
   and as a plain hosted/opened file (anchor fallback) ---- */
let _dlCap;
async function getDownloads(){
  if(_dlCap!==undefined)return _dlCap;
  try{_dlCap=(window.claude&&claude.use)?await claude.use("downloads"):null;}
  catch(e){_dlCap=null;}
  return _dlCap;
}
function anchorSave(blob,name){
  try{const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},800);return true;}catch(e){return false;}
}
async function saveFile(name,blob){
  const dl=await getDownloads();
  if(dl){try{await dl.save({filename:name,data:blob});toast("Saved ✓");return;}
    catch(e){if(e&&e.code==="declined")return;}}
  if(!anchorSave(blob,name))toast("Couldn't save file");
}

$("#healthFile").addEventListener("change",function(){
  const files=Array.from(this.files||[]);this.value="";
  if(!files.length)return;
  let done=0, touchedDays=new Set(), bad=0;
  const finish=()=>{
    if(done<files.length)return;
    if(touchedDays.size){state.settings.lastSync=Date.now();save();renderActive();
      toast(`✓ Synced ${touchedDays.size} day${touchedDays.size>1?'s':''} from ${files.length} file${files.length>1?'s':''}`);}
    else toast(bad?"Those look like Excel/Sheets files — export as CSV":"No readable rows — need a CSV with a date column");
  };
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{try{
      const txt=(r.result||"");
      let binary=false;for(let bi=0;bi<Math.min(16,txt.length);bi++){const cc=txt.charCodeAt(bi);if(cc===0||cc===65533){binary=true;break;}}
      if(txt.slice(0,2)==="PK"||binary){bad++;}
      else{const days=importHealthDays(txt,f.name,true);days.forEach(d=>touchedDays.add(d));}
    }catch(e){}finally{done++;finish();}};
    r.onerror=()=>{done++;finish();};
    r.readAsText(f);
  });
});
$("#importFile").addEventListener("change",function(){
  const f=this.files&&this.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const obj=JSON.parse(r.result);
    if(obj&&Array.isArray(obj.workouts)){state=obj;
      state.settings=Object.assign({unit:"kg",weeklyGoal:4},state.settings||{});state.tplNames=state.tplNames||{};
      save();renderAll();$$('.scrim').forEach(s=>s.remove());toast("Data restored ✓");}
    else toast("Not an Ascend backup");
  }catch(e){toast("Couldn't read that file");}};
  r.readAsText(f);this.value="";
});
