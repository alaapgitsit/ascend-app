const MEALS=["Breakfast","Lunch","Dinner","Snacks"];
function dkey(date){const d=new Date(date);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function fmtFullDate(d){return new Date(d).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});}
function fmtDDMMYYYY(d){d=new Date(d);const p=n=>String(n).padStart(2,"0");return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()}`;}
// Chart helpers: a "YYYY-MM-DD" key → "DD-MM" (axis) or "DD-MM-YYYY" (tooltip).
function axisDMY(l){const m=String(l).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+'-'+m[2]:String(l);}
function fullDMY(l){const m=String(l).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+'-'+m[2]+'-'+m[1]:String(l);}
function histFor(date){return CAL_HISTORY[dkey(date)]||null;}
function foodDay(date){return (state.food&&state.food[dkey(date)])||null;}
function mealTotal(date,m){const fd=foodDay(date);if(!fd||!fd[m])return null;return Math.round(fd[m].reduce((a,it)=>a+(+it.k||0),0));}
function foodTotals(date){
  const fd=foodDay(date);
  if(fd){let k=0,p=0,c=0,f=0;MEALS.forEach(m=>(fd[m]||[]).forEach(it=>{k+=+it.k||0;p+=+it.p||0;c+=+it.c||0;f+=+it.f||0;}));
    return {kcal:Math.round(k),p:Math.round(p),c:Math.round(c),f:Math.round(f),source:"live"};}
  // only past days fall back to imported totals; today/future start fresh at 0
  if(dkey(date) < dkey(Date.now())){const h=histFor(date);
    if(h&&h.kcal!=null)return {kcal:h.kcal||0,p:h.p||0,c:h.c||0,f:h.f||0,source:"history"};}
  return {kcal:0,p:0,c:0,f:0,source:"empty"};
}
function macroGoals(){return state.settings.macros||null;}
function macroChips(ft){const g=macroGoals();
  const cell=(lbl,val,tgt,cls)=>{const over=tgt&&val>tgt;return `<span class="mc ${cls}${over?' over':''}">${lbl} ${val}${tgt?('/'+tgt):''}g${over?' ⚠':''}</span>`;};
  return `<div class="macros">${cell('C',ft.c,g&&g.c,'c')}${cell('P',ft.p,g&&g.p,'p')}${cell('F',ft.f,g&&g.f,'f')}</div>`;
}
function bodyVal(date,field){const k=dkey(date);
  if(state.body&&state.body[k]&&state.body[k][field]!=null)return state.body[k][field];
  const h=CAL_HISTORY[k];if(h&&h[field]!=null)return h[field];return null;}
function mergedDaily(field){
  const m={};
  for(const d in CAL_HISTORY){const v=CAL_HISTORY[d][field];if(v!=null)m[d]=v;}
  if(state.body)for(const d in state.body){const v=state.body[d][field];if(v!=null)m[d]=v;}
  return Object.keys(m).sort().map(d=>({date:d,val:m[d]}));
}
function kcalDaily(){
  const m={};
  for(const d in CAL_HISTORY){const v=CAL_HISTORY[d].kcal;if(v!=null)m[d]=v;}
  if(state.food)for(const d in state.food){const t=foodTotals(new Date(d+"T12:00"));if(t.source==="live")m[d]=t.kcal;}
  return Object.keys(m).sort().map(d=>({date:d,val:m[d]}));
}
function latestVal(field){const s=mergedDaily(field);if(!s.length)return {val:null,date:null};
  const today=dkey(Date.now());let r={val:null,date:null};
  for(const p of s){if(p.date<=today)r={val:p.val,date:p.date};}return r;}
// Value as it stood on a given date: that date's reading if present, else the most
// recent one on or before it (so a past date shows the weight it was then, never a
// future weight). Used for sticky fields like weight that aren't logged every day.
function valAsOf(field,date){const s=mergedDaily(field);if(!s.length)return {val:null,date:null};
  const k=dkey(date);let r={val:null,date:null};
  for(const p of s){if(p.date<=k)r={val:p.val,date:p.date};}return r;}
function addFood(date,meal,item){const k=dkey(date);state.food[k]=state.food[k]||{};state.food[k][meal]=state.food[k][meal]||[];state.food[k][meal].push(item);save();}
function insertFood(date,meal,idx,item){const k=dkey(date);state.food[k]=state.food[k]||{};state.food[k][meal]=state.food[k][meal]||[];
  const arr=state.food[k][meal];arr.splice(Math.max(0,Math.min(idx,arr.length)),0,item);save();}
function removeFood(date,meal,idx){const k=dkey(date);if(state.food[k]&&state.food[k][meal]){state.food[k][meal].splice(idx,1);
  if(!state.food[k][meal].length)delete state.food[k][meal];
  if(!Object.keys(state.food[k]).length)delete state.food[k];save();}}
function foodItem(date,meal,idx){const fd=foodDay(date);return fd&&fd[meal]&&fd[meal][idx]?fd[meal][idx]:null;}
function moveFood(fromDate,fromMeal,idx,toDate,toMeal,copy){
  const it=foodItem(fromDate,fromMeal,idx);if(!it)return false;
  addFood(toDate,toMeal,Object.assign({},it));
  if(!copy)removeFood(fromDate,fromMeal,idx);
  return true;}
function copyMeal(fromDate,meal,toDate,toMeal){
  const fd=foodDay(fromDate);const items=(fd&&fd[meal])||[];if(!items.length)return 0;
  items.forEach(it=>addFood(toDate,toMeal,Object.assign({},it)));return items.length;}

/* ---------- Water ---------- */
function waterTotal(date){return state.water[dkey(date)]||0;}
function addWater(date,ml){const k=dkey(date);state.water[k]=Math.max(0,(state.water[k]||0)+ml);if(!state.water[k])delete state.water[k];save();}
function setWater(date,ml){const k=dkey(date);if(ml>0)state.water[k]=Math.round(ml);else delete state.water[k];save();}
const WATER_CONTAINERS=[["½ glass",125],["Glass",250],["Bottle",500],["Cup",200]];
function waterFmt(ml){ // respect display unit
  const u=state.settings.waterUnit||"ml";
  if(u==="glass")return round1(ml/250)+" glass"+(Math.abs(ml/250-1)<1e-9?"":"es");
  if(u==="cup")return round1(ml/240)+" cup"+(Math.abs(ml/240-1)<1e-9?"":"s");
  if(u==="oz")return round1(ml/29.5735)+" oz";
  return fmtNum(ml)+" ml";}

/* ---------- Garmin / Ascend training fusion ---------- */
const FUSE_MS=10*60*1000; // ±10 min tolerance
function garminOn(date){const k=dkey(date);return (state.garminWorkouts||[]).filter(g=>dkey(g.start)===k||dkey(g.end)===k);}
function gwOverlapsAscend(g,w){ // within ±10 min of the Ascend session's window
  const ws=new Date(w.date).getTime();
  const wEnd=ws+((w.durationSec||45*60)*1000);
  return (g.start<=wEnd+FUSE_MS)&&(g.end>=ws-FUSE_MS);}
function trainingItems(date){
  // Build the unified list the Today card shows: Ascend workouts (fused with
  // a matching Garmin Strength/HIIT session when within ±10 min), plus
  // standalone Garmin sessions (runs, rides, and unmatched strength/HIIT).
  const out=[];
  const gw=garminOn(date).slice();
  const used=new Set();
  const asc=state.workouts.filter(w=>sameDay(w.date,date));
  asc.forEach(w=>{
    // fuse with the nearest strength/HIIT garmin session in range
    let best=-1,bestGap=Infinity;
    gw.forEach((g,gi)=>{if(used.has(gi))return;if(g.type!=="strength"&&g.type!=="hiit")return;
      if(gwOverlapsAscend(g,w)){const gap=Math.abs(g.start-new Date(w.date).getTime());if(gap<bestGap){bestGap=gap;best=gi;}}});
    const g=best>=0?gw[best]:null;if(g)used.add(best);
    out.push({kind:"ascend",id:w.id,name:tplDisplayName(w.templateId),ex:w.exercises.length,
      volume:Math.round(fromKg(workoutVolumeKg(w))),when:new Date(w.date).getTime(),
      kcal:g?g.kcal:null,avgHr:g?g.avgHr:null,maxHr:g?g.maxHr:null,fused:!!g});
  });
  gw.forEach((g,gi)=>{if(used.has(gi))return;
    out.push({kind:"garmin",gtype:g.type,name:g.title||gTypeName(g.type),when:g.start,
      kcal:g.kcal,avgHr:g.avgHr,maxHr:g.maxHr,distanceKm:g.distanceKm,durMin:Math.round((g.end-g.start)/60000)});});
  out.sort((a,b)=>a.when-b.when);
  return out;}
function gTypeName(t){return ({run:"Running",bike:"Cycling",strength:"Strength",hiit:"HIIT",walk:"Walk",swim:"Swim"})[t]||"Workout";}
function gTypeIcon(t){ // simple inline svg stroke paths
  const p=({run:'<path d="M13 4a1 1 0 100 2 1 1 0 000-2zM7 20l3-5 2 2 1 3M10 15l-1-4 3-2 3 2 2-1"/>',
    bike:'<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h4l2 4M9 9h4"/>',
    strength:'<path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/>',
    hiit:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'})[t]||'<path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/>';
  return `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;}

/* ---------- Profile / goal weight ---------- */
function profileGoalProgress(){
  const p=state.profile||{};const start=p.startKg,goal=p.goalKg;
  const cur=latestVal("weight").val;
  if(start==null||goal==null||cur==null)return null;
  const total=start-goal, done=start-cur;
  const pct=total!==0?Math.max(0,Math.min(100,Math.round(done/total*100))):0;
  return {start,goal,cur,pct,remaining:round1(cur-goal)};}

function dateBar(){

   <button class="dnav" id="dNext" ${isToday?'disabled':''} aria-label="Next day">›</button></div>`;
}

        <div class="cal-side">
          <div class="cal-budget"><span>Budget</span><b class="tnum" id="budEdit">${budget.toLocaleString()}</b></div>

    if(item)toastUndo("Removed "+(item.n||'item'),()=>{insertFood(d,m,idx,item);renderFood();});}));
  $$('[data-move-food]',el).forEach(b=>b.addEventListener('click',()=>{const parts=b.dataset.moveFood.split("::");openFoodActions(parts[0],+parts[1]);}));
  const be=$("#budEdit",el);if(be)be.addEventListener('click',openBudget);
  if(sameDay(viewDate,Date.now())){pushTodaySummary();maybeCelebrate(mealStreak(),stepStreak(),workoutStreak());}
}
// Foods the user has actually logged (newest first, deduped by name) — so search
// finds everything they've added, not only the baked catalogue.
function myLoggedFoods(){
  const seen=new Map();
  const days=Object.keys(state.food||{}).sort().reverse();
  for(const dk of days){const fd=state.food[dk];if(!fd)continue;
    for(const m of MEALS){(fd[m]||[]).forEach(it=>{const key=(it.n||'').toLowerCase();
      if(key&&!seen.has(key))seen.set(key,{n:it.n,a:it.a,k:it.k,p:it.p||0,c:it.c||0,f:it.f||0,m:it.m});});}}
  return [...seen.values()];
}
// Full searchable set: my foods first, then the catalogue (deduped by name).
function searchableFoods(){
  const mine=myLoggedFoods();const names=new Set(mine.map(f=>f.n.toLowerCase()));
  const out=mine.slice();
  FOOD_LIB.forEach(f=>{const k=f.n.toLowerCase();if(!names.has(k)){names.add(k);out.push(f);}});
  return out;
}

/* ===== Measure model — every food gets a canonical basis (ml, g or serving)
   so quantities convert exactly across units and portions can be re-edited. ===== */
const VOLF={ml:1,l:1000,tsp:5,tbsp:15,cup:240,floz:30,glass:250};   // → millilitres
const MASSF={g:1,kg:1000,oz:28.3495,lb:453.592};                    // → grams
const DRINKPRE={'Can 220 ml':220,'Can 250 ml':250,'Can 330 ml':330,'Bottle 330 ml':330,'Bottle 500 ml':500,'Bottle 750 ml':750};
const SIZEF={small:0.7,medium:1,large:1.4,half:0.5,slice:1,piece:1};
const DRINK_RE=/coffee|latte|flat\s*white|cappu|espresso|americano|mocha|\btea\b|\bchai\b|water|juice|milk|smoothie|shake|soda|cola|\bbeer\b|wine|drink|cocktail|lemonade|kombucha|cider|\bale\b/i;
function parseBase(name,a){
  const s=(""+(a||"")).toLowerCase();const drink=DRINK_RE.test((name||"")+" "+s);
  let m=s.match(/([\d.]+)\s*ml\b/); if(m)return{dim:'ml',amt:+m[1]};
  m=s.match(/([\d.]+)\s*l\b/); if(m)return{dim:'ml',amt:+m[1]*1000};
  m=s.match(/([\d.]+)\s*kg\b/); if(m)return{dim:'g',amt:+m[1]*1000};
  m=s.match(/([\d.]+)\s*g\b/); if(m)return{dim:'g',amt:+m[1]};
  m=s.match(/([\d.]+)\s*fl\s*oz\b/); if(m)return{dim:'ml',amt:+m[1]*30};
  m=s.match(/([\d.]+)\s*oz\b/); if(m)return drink?{dim:'ml',amt:+m[1]*30}:{dim:'g',amt:+m[1]*28.3495};
  m=s.match(/([\d.]+)\s*cup/); if(m)return{dim:'ml',amt:+m[1]*240};
  m=s.match(/([\d.]+)\s*(?:tbsp|tablespoon)/); if(m)return{dim:'ml',amt:+m[1]*15};
  m=s.match(/([\d.]+)\s*(?:tsp|teaspoon)/); if(m)return{dim:'ml',amt:+m[1]*5};

function measureModel(food){

function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}

function unitLabelShort(u){

  if(u.startsWith('u:'))return {floz:'fl oz',ml:'ml',g:'g',kg:'kg',oz:'oz',cup:'cups',tbsp:'tbsp',tsp:'tsp',glass:'glasses'}[u.slice(2)]||u.slice(2);

function unitStep(u){if(u.startsWith('u:')){const k=u.slice(2);return (k==='ml'||k==='g')?10:1;}if(u.startsWith('c:'))return 1;return 0.5;} // serving/size step 0.5 so portions go below 1

let _zxingP=null;
function loadZXing(){
  if(window.ZXingBrowser||window.ZXing)return Promise.resolve();
  if(_zxingP)return _zxingP;
  _zxingP=new Promise((res,rej)=>{
    const s=document.createElement('script');

    s.onload=()=>res();s.onerror=()=>rej(new Error("zxing"));

function offLookup(code){
  const url="https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+
    ".json?fields=product_name,brands,nutriments,serving_size,quantity";
  return fetch(url,{headers:{'Accept':'application/json'}}).then(r=>r.json()).then(j=>{
    if(!j||j.status!==1||!j.product)return null;
    const p=j.product,nu=p.nutriments||{};
    // Prefer per-serving values if present, else per-100g.
    const servTxt=(p.serving_size||'').trim();
    const hasServ=nu['energy-kcal_serving']!=null||nu.proteins_serving!=null;
    const pick=(base)=>{
      const sv=nu[base+'_serving'], h=nu[base+'_100g'];
      return (hasServ&&sv!=null)?+sv:(h!=null?+h:0);
    };
    let k=pick('energy-kcal');
    if(!k){const ej=hasServ&&nu['energy-kj_serving']!=null?+nu['energy-kj_serving']:(nu['energy-kj_100g']!=null?+nu['energy-kj_100g']:0);if(ej)k=ej/4.184;}
    const name=(p.product_name||'').trim()||('Barcode '+code);
    const brand=(p.brands||'').split(',')[0].trim();
    const amt=hasServ&&servTxt?servTxt:(nu['energy-kcal_serving']!=null?servTxt:'100 g');
    return {
      n:brand?name+' ('+brand+')':name,
      a:amt||'1 serving',
      k:Math.round(k),
      p:round1(+pick('proteins')||0),
      c:round1(+pick('carbohydrates')||0),
      f:round1(+pick('fat')||0)
    };
  });
}
// Open Food Facts TEXT search — find foods not in the catalogue.
function offSearch(query){
  // No sort_by — the popularity sort makes Open Food Facts' search time out.
  const url="https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(query)+
    "&search_simple=1&action=process&json=1&page_size=25&fields=product_name,brands,nutriments";
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),13000);
  return fetch(url,{signal:ctrl.signal}).then(r=>r.json()).then(j=>{
    clearTimeout(to);
    const prods=(j&&j.products)||[];const out=[];
    prods.forEach(p=>{
      const nu=p.nutriments||{};const k=+nu['energy-kcal_100g'];
      if(!(k>0))return;
      const name=(p.product_name||'').trim();if(!name)return;
      const brand=(p.brands||'').split(',')[0].trim();
      const per={k:k/100,p:(+nu.proteins_100g||0)/100,c:(+nu.carbohydrates_100g||0)/100,f:(+nu.fat_100g||0)/100};
      out.push({n:brand?name+' ('+brand+')':name,a:'100 g',k:Math.round(k),
        p:round1(per.p*100),c:round1(per.c*100),f:round1(per.f*100),
        m:{dim:'g',serv:100,per:per}});
    });
    return out;
  });
}

function openScanner(meal,addSheet,closeAdd,draw){
  const native=!!(window.AndroidAscend&&window.AndroidAscend.isNativeAvailable);
  const sheet=document.createElement("div");sheet.className="scrim";
  sheet.innerHTML=`<div class="sheet scan-sheet"><div class="grab"></div>
    <h2>Scan barcode</h2>
    <div class="scan-stage"><video id="scanVid" playsinline muted></video><div class="scan-frame"></div></div>
    <div class="scan-status" id="scanStatus">Point the camera at the barcode…</div>
    <div class="section-title" style="margin-top:14px">Or enter the barcode</div>
    <div class="cf-row"><input id="scanManual" inputmode="numeric" placeholder="e.g. 5000159484695"><button class="btn btn-primary" id="scanLook" style="width:auto;padding:0 18px">Look up</button></div>
    <button class="btn btn-ghost btn-block" id="scanClose" style="margin-top:10px;color:var(--faint)">Cancel</button>
  </div>`;
  document.body.appendChild(sheet);
  const vid=$("#scanVid",sheet),status=$("#scanStatus",sheet);
  let stream=null,detector=null,raf=null,zxCtrl=null,done=false;
  const stop=()=>{try{if(raf)cancelAnimationFrame(raf);}catch(e){}
    try{if(zxCtrl&&zxCtrl.stop)zxCtrl.stop();}catch(e){}
    try{if(stream)stream.getTracks().forEach(t=>t.stop());}catch(e){}};
  const close=()=>{stop();sheet.remove();};
  sheet.addEventListener('click',e=>{if(e.target===sheet)close();});
  $("#scanClose",sheet).addEventListener('click',close);
  const found=(code)=>{
    if(done)return;done=true;stop();
    status.textContent="Looking up "+code+"…";
    offLookup(code).then(food=>{
      if(!food){status.textContent="Not found for "+code+". Try entering it, or add it as a custom food.";done=false;return;}

    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      status.textContent=native?"Camera unavailable on this device.":"Camera needs the installed app. Enter the barcode below instead.";return;}
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}}).then(s=>{
      stream=s;vid.srcObject=s;vid.play();
      if('BarcodeDetector' in window){
        try{detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']});}catch(e){detector=null;}
      }
      if(detector){
        const scan=()=>{if(done)return;detector.detect(vid).then(codes=>{
          if(codes&&codes.length){found(codes[0].rawValue);}else{raf=requestAnimationFrame(scan);}
        }).catch(()=>{raf=requestAnimationFrame(scan);});};
        raf=requestAnimationFrame(scan);
      }else{
        status.textContent="Loading scanner…";
        loadZXing().then(()=>{
          const Z=window.ZXingBrowser;if(!Z){status.textContent="Scanner unavailable — enter the barcode below.";return;}
          status.textContent="Point the camera at the barcode…";
          const reader=new Z.BrowserMultiFormatReader();
          reader.decodeFromVideoElement(vid,(result)=>{if(result&&!done)found(result.getText());}).then(c=>{zxCtrl=c;}).catch(()=>{});
        }).catch(()=>{status.textContent="Scanner unavailable — enter the barcode below.";});
      }
    }).catch(err=>{
      status.textContent=(err&&err.name==='NotAllowedError')?"Camera permission denied. Enter the barcode below.":(native?"Couldn't open the camera. Enter the barcode below.":"Camera needs the installed app. Enter the barcode below.");
    });
  };
  startCam();
}

// AI meal scan — sends the photo to the vision model whose key you saved in
// Settings (Anthropic or OpenAI). Returns {food,confidence} or {error}. Works in
// the installed app (has internet); the browser sandbox blocks the call.
function aiScanConfigured(){return !!((state.settings.aiKey||'').trim());}
async function aiMealScan(dataUrl){
  const s=state.settings;const key=(s.aiKey||'').trim();if(!key)return {error:'nokey'};
  const prov=s.aiProvider||'anthropic';
  const PROMPT='You are a nutrition estimator. Identify the single main food or drink in this photo and estimate nutrition for the portion actually shown. Reply with ONLY compact JSON and nothing else: {"name":"short name","serving":"portion e.g. 1 plate (~300 g)","kcal":0,"protein_g":0,"carbs_g":0,"fat_g":0,"confidence":0.0}. Give your best numeric estimate even if unsure.';
  try{
    let text;
    if(prov==='openai'){
      const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",
        headers:{"Authorization":"Bearer "+key,"content-type":"application/json"},
        body:JSON.stringify({model:(s.aiModel||"gpt-4o-mini"),max_tokens:400,messages:[{role:"user",content:[{type:"text",text:PROMPT},{type:"image_url",image_url:{url:dataUrl}}]}]})});
      const j=await r.json();if(!r.ok)return {error:(j&&j.error&&j.error.message)||('HTTP '+r.status)};
      text=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    }else{
      const b64=(dataUrl.split(',')[1]||'');
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
        headers:{"x-api-key":key,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:(s.aiModel||"claude-haiku-4-5"),max_tokens:400,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:PROMPT}]}]})});
      const j=await r.json();if(!r.ok)return {error:(j&&j.error&&j.error.message)||('HTTP '+r.status)};
      text=j&&j.content&&j.content[0]&&j.content[0].text;
    }
    if(!text)return {error:'empty response'};
    const m=text.match(/\{[\s\S]*\}/);if(!m)return {error:'could not read result'};
    const o=JSON.parse(m[0]);
    return {food:{n:(o.name||'Meal'),a:(o.serving||'photo'),k:Math.round(+o.kcal||0),p:round1(+o.protein_g||0),c:round1(+o.carbs_g||0),f:round1(+o.fat_g||0)},confidence:(+o.confidence||null)};
  }catch(e){return {error:(e&&e.message)||'network error'};}
}

      });

  $("#pRetake",sheet).addEventListener('click',()=>{shot.hidden=true;vid.hidden=false;$("#pConfirm",sheet).hidden=true;$("#pCapRow",sheet).hidden=false;status.textContent="Frame the plate, then tap Capture.";start();});
  $("#pAdd",sheet).addEventListener('click',()=>{

  start();

/* ---- Google Drive auto-read via the viewer's connector (mcp capability) ---- */
const DRIVE_SERVER="Google Drive";
function isNativeApp(){return !!(window.AndroidAscend&&window.AndroidAscend.requestSync);}
function syncHealth(){
  if(isNativeApp()){toast("Reading from your ring…");try{window.AndroidAscend.requestSync();}catch(e){toast("Native sync error");}return;}
  driveSync();
}
async function getMcp(){try{return (window.claude&&claude.use)?await claude.use("mcp"):null;}catch(e){return null;}}
function b64ToText(s){try{return decodeURIComponent(escape(atob(s)));}catch(e){try{return atob(s);}catch(e2){return s;}}}
function looksBase64(s){return typeof s==="string"&&s.length>16&&/^[A-Za-z0-9+/=\s]+$/.test(s)&&s.indexOf("\n")<0&&s.indexOf(",")<0;}
function maybeDecode(s){ // raw CSV passes through; base64 gets decoded
  if(typeof s!=="string")return "";
  if(/[\n,;]/.test(s))return s; // already delimited text
  if(looksBase64(s)){const t=b64ToText(s);if(/[\n,;]/.test(t))return t;}
  return s;
}
function extractContent(payload){
  if(payload==null)return "";
  if(typeof payload==="string")return maybeDecode(payload);
  const c=payload.content??payload.data??payload.base64Content??payload.text??payload.body??payload.fileContent;
  return maybeDecode(c);
}
async function driveSync(){
  toast("Checking Google Drive…");
  const mcp=await getMcp();
  if(!mcp){toast("Open Ascend inside the Claude app (signed in) to use Drive sync");return;}
  try{
    const since=new Date(Date.now()-1000*3600*24*14).toISOString();
    const q=`mimeType='text/csv' and modifiedTime > '${since}' and (title contains 'Activity' or title contains 'Vitals' or title contains 'Sleep')`;
    const res=await mcp.callTool(DRIVE_SERVER,"search_files",{query:q,pageSize:30,excludeContentSnippets:true});
    const files=((res&&res.payload&&res.payload.files)||[]);
    if(!files.length){toast("No Activity/Vitals/Sleep CSVs found in Drive (last 14 days)");return;}
    // newest file per category
    const pick={};
    files.forEach(f=>{const t=(f.title||"").toLowerCase();["activity","vitals","sleep"].forEach(cat=>{
      if(t.includes(cat)){const prev=pick[cat];if(!prev||new Date(f.modifiedTime)>new Date(prev.modifiedTime))pick[cat]=f;}});});
    const chosen=Object.values(pick);
    if(!chosen.length){toast("Found CSVs but none named Activity/Vitals/Sleep");return;}
    let days=new Set();
    for(const f of chosen){
      const dl=await mcp.callTool(DRIVE_SERVER,"download_file_content",{fileId:f.id});
      const text=extractContent(dl&&dl.payload);
      importHealthDays(text,f.title,true).forEach(d=>days.add(d));
    }
    if(days.size){state.settings.lastSync=Date.now();save();renderActive();toast(`✓ Drive sync: ${days.size} day${days.size>1?'s':''} from ${chosen.length} file${chosen.length>1?'s':''}`);}
    else toast("Files read but no new rows — check the column names");
  }catch(e){
    const code=e&&e.code;
    if(code==="needs_reauth")toast("Reconnect Google Drive in claude.ai → Settings → Connectors");
    else if(code==="server_not_connected"||code==="not_granted")toast("Add Google Drive in claude.ai → Settings → Connectors");
    else if(code==="server_unavailable"||code==="upstream_error")toast("Drive busy — try again in a moment");
    else toast("Drive sync failed"+(e&&e.message?": "+e.message:""));
  }
}
function lastSyncText(){const t=state.settings.lastSync;
  if(!t)return "Not synced yet. Export your Health Connect data (CSV/JSON) with an app like Health Sync, then tap to import.";
  const mins=Math.round((Date.now()-t)/60000);
  const ago=mins<1?"just now":mins<60?mins+" min ago":Math.round(mins/60)+"h ago";
  return "Last synced "+ago+" · "+new Date(t).toLocaleString(undefined,{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});}
function round2(v){return Math.round(v*100)/100;}
function minToH(v){return v>24?round2(v/60):round2(v);}  // keep minute precision for sleep
function normDate(s){s=(""+(s||"")).trim();if(!s)return null;
  let d=new Date(s);
  if(isNaN(d.getTime())){const m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(m){let yr=+m[3];if(yr<100)yr+=2000;d=new Date(yr,(+m[2])-1,+m[1]);}}
  if(isNaN(d.getTime()))return null;const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
const HEALTH_FIELDS=["steps","deep","sleep","hrv","weight","waist","hip","chest","bps","bpd"];
function normalizeRow(o){const row={date:normDate(o.date||o.day||o.Date||o.Day)};
  const map={steps:/step/i,deep:/deep/i,sleep:/^sleep$|total.*sleep|sleep.*total|^asleep/i,hrv:/hrv|variab/i,weight:/weight|mass/i,waist:/waist/i,hip:/hip/i,chest:/chest/i,bps:/systolic|bps/i,bpd:/diastolic|bpd/i};
  for(const key in o){const lk=key.toLowerCase();for(const f in map){if(map[f].test(lk)){let v=parseFloat(o[key]);
    if(isFinite(v)){if(f==="deep"||f==="sleep")v=minToH(v);else if(f==="hrv"||f==="weight")v=round1(v);else v=Math.round(v);row[f]=v;}}}}
  return row;}
function importHealthData(text,name,gapFill){
  let rows=[];const t=(text||"").trim();if(!t)return 0;
  if((name||"").toLowerCase().endsWith(".json")||t[0]==="["||t[0]==="{"){
    let j=JSON.parse(t);if(!Array.isArray(j))j=j.days||j.data||j.records||[];rows=j.map(normalizeRow);
  }else{
    const lines=t.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return 0;
    const sep=lines[0].indexOf(";")>-1&&lines[0].indexOf(",")<0?";":",";
    const head=lines[0].split(sep).map(h=>h.trim().toLowerCase());
    const find=re=>head.findIndex(h=>re.test(h));
    const di=find(/date|day|time/),si=find(/step/),dpi=head.findIndex(h=>/deep/.test(h)),
      sli=head.findIndex(h=>/sleep/.test(h)&&!/deep/.test(h)),hi=find(/hrv|variab/),
      wi=find(/weight|mass/),wa=find(/waist/),hp=find(/hip/),ch=find(/chest/),sy=find(/systolic/),dia=find(/diastolic/);
    for(let i=1;i<lines.length;i++){const c=lines[i].split(sep);const g=k=>k>=0?parseFloat(c[k]):NaN;
      const d=normDate(di>=0?c[di]:"");if(!d)continue;const row={date:d};
      if(isFinite(g(si)))row.steps=Math.round(g(si));
      if(isFinite(g(dpi)))row.deep=minToH(g(dpi));
      if(isFinite(g(sli)))row.sleep=minToH(g(sli));
      if(isFinite(g(hi)))row.hrv=round1(g(hi));
      if(isFinite(g(wi)))row.weight=round1(g(wi));
      if(isFinite(g(wa)))row.waist=round1(g(wa));
      if(isFinite(g(hp)))row.hip=round1(g(hp));
      if(isFinite(g(ch)))row.chest=round1(g(ch));
      if(isFinite(g(sy)))row.bps=Math.round(g(sy));
      if(isFinite(g(dia)))row.bpd=Math.round(g(dia));
      rows.push(row);}
  }
  const touched=[];
  // Weight + body measurements are values the user owns: sync may FILL an empty day,
  // but must never overwrite one that already has a value (in state.body OR the baked
  // CAL_HISTORY). Only steps/sleep/deep/hrv are Health-Connect-authoritative.
  const FILL_ONLY=new Set(["weight","waist","hip","chest","bps","bpd"]);
  rows.forEach(r=>{if(!r||!r.date)return;const k=r.date;const cur=state.body[k]||{};let hit=false;
    const man=state.bodyManual&&state.bodyManual[k];const hist=CAL_HISTORY[k];
    HEALTH_FIELDS.forEach(f=>{if(r[f]!=null&&isFinite(r[f])){
      if(man&&man[f])return;           // the user typed this value — never overwrite it
      if(FILL_ONLY.has(f)&&(cur[f]!=null||(hist&&hist[f]!=null)))return; // never clobber an existing measurement
      if(gapFill&&cur[f]!=null)return; // Health Connect first — only fill what it missed
      cur[f]=r[f];hit=true;}});
    if(hit){state.body[k]=cur;touched.push(k);}});

  return touched;
}
// back-compat single-file helpers. gapFill=true means a secondary source that

  const feDel=$("#feDel",sheet);if(feDel)feDel.addEventListener('click',()=>{hist.splice(idx,1);save();close();renderHome();toast("Fast deleted");});
  $("#feSave",sheet).addEventListener('click',()=>{
    const s=readStart();
    if(!isFinite(s)){toast("Enter a valid start date & time");return;}
    if(active){if(s>Date.now()){toast("Start can't be in the future");return;}state.fasting.start=s;save();close();renderHome();toast("Fast start updated");return;}
    const e=readEnd();
    if(!isFinite(e)||e<=s){toast("End must be after start");return;}
    if(mode==="new"){hist.push({start:s,end:e});hist.sort((a,b)=>a.start-b.start);}
    else{hist[idx]={start:s,end:e};}
    save();close();renderHome();toast("Fast saved");
  });
}
function openFastProto(){
  const sheet=document.createElement("div");sheet.className="scrim";
  sheet.innerHTML=`<div class="sheet"><div class="grab"></div><h2>Fasting protocol</h2>
    <div class="proto-grid">${Object.keys(FAST_PROTOCOLS).map(p=>`<button class="proto-opt ${p===state.fasting.protocol?'on':''}" data-p="${p}">${p}<small>${FAST_PROTOCOLS[p]}h fast</small></button>`).join("")}</div>
    <button class="btn btn-ghost btn-block" id="protoClose" style="margin-top:14px;color:var(--faint)">Done</button></div>`;
  document.body.appendChild(sheet);const close=()=>sheet.remove();
  sheet.addEventListener('click',e=>{if(e.target===sheet)close();});
  $("#protoClose",sheet).addEventListener('click',close);
  $$('.proto-opt',sheet).forEach(b=>b.addEventListener('click',()=>{state.fasting.protocol=b.dataset.p;save();close();renderHome();}));
}
function bpText(){const s=latestVal("bps"),d=latestVal("bpd");if(s.val==null)return "–";return `${s.val}/${d.val!=null?d.val:'–'}`;}
function jabText(){const j=latestVal("jab");if(j.val==null)return "–";return `${round1(j.val)}<small>mg</small>`;}

/* ---- native bridge: the Android wrapper calls this to inject Health Connect data ---- */
window.__ascendHealthImport=function(rows){
  try{
    const arr=(typeof rows==="string")?JSON.parse(rows):rows;
    if(!Array.isArray(arr)||!arr.length)return 0;
    const n=importHealthDays(JSON.stringify(arr),"native.json");
    const days=Array.isArray(n)?n.length:n;
    if(days){state.settings.lastSync=Date.now();save();renderActive();
      if(typeof toast==="function")toast(`✓ Synced ${days} day${days>1?'s':''} from your ring`);}
    return days;
  }catch(e){return 0;}
};
// Native bridge: Garmin / Health Connect exercise sessions. Replaces any session
// already stored for the same start time so re-syncs don't duplicate.
window.__ascendWorkoutsImport=function(list){
  try{
    const arr=(typeof list==="string")?JSON.parse(list):list;
    if(!Array.isArray(arr))return 0;
    const byStart={};
    (state.garminWorkouts||[]).forEach(g=>{byStart[g.start]=g;});
    let n=0;
    arr.forEach(r=>{
      if(!r||r.start==null||r.end==null)return;
      byStart[r.start]={start:+r.start,end:+r.end,type:r.type||"other",
        kcal:r.kcal!=null?+r.kcal:null,avgHr:r.avgHr!=null?+r.avgHr:null,maxHr:r.maxHr!=null?+r.maxHr:null,
        distanceKm:r.distanceKm!=null?+r.distanceKm:null,title:r.title||null};
      n++;});
    state.garminWorkouts=Object.values(byStart).sort((a,b)=>a.start-b.start).slice(-400);
    save();if(activeTab==="home")renderHome();
    return n;
  }catch(e){return 0;}
};
// Diagnostic: the native layer reports what each app wrote for the latest night.
window.__ascendSleepDebug=function(s){try{state.settings.sleepDbg=s||"";save();if(activeTab==="body")renderBody();}catch(e){}};
window.__ascendIsReady=function(){return true;};
window.__ascendBack=function(){
  try{const scrim=document.querySelector('.scrim');if(scrim){scrim.remove();return true;}
    if(typeof activeTab!=='undefined'&&activeTab!=='home'){setTab('home');return true;}
  }catch(e){}
  return false;
};
// Where to land when the app is reopened/unlocked: the Log tab if a workout is
// in progress, otherwise Home (the default for non-training opens).
function resumeTab(){return (session&&Array.isArray(session.exercises))?'log':'home';}
window.__ascendForceHome=function(){try{setTab(resumeTab());}catch(e){}};
// PWA / browser: on returning to the app, jump to the live workout (but never
// force Home on a normal re-focus — only redirect when a session is active).
document.addEventListener('visibilitychange',()=>{try{
  if(document.visibilityState==='visible'&&session&&activeTab!=='log')setTab('log');
}catch(e){}});


// boot — restore any in-progress workout saved before the app closed
try{const d=loadDraft();if(d&&Array.isArray(d.exercises)){session=d;session.startedAt=Date.now();
  session.timer=session.timer||{running:false,elapsedBefore:0,startedAt:null};
  if(session.timer.running){session.timer.running=false;session.timer.startedAt=null;} // pause on restore, don't count closed time
  startAutoSave();}}catch(e){}
if(session){setTab('log');setTimeout(()=>toast("Resumed your in-progress workout"),500);}
else renderHome();
</script>
